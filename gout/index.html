<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>痛风小针</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<link rel="stylesheet" href="../shared/style.css">
</head>
<body>
<div class="wrap">
  <header>
    <span class="tag">关节小剧场 · 7 幕</span>
    <h1>尿酸变成<em>小针</em>，关节为什么这么痛</h1>
    <p class="lede">走进大脚趾的关节看一看：尿酸从哪里来，怎样变成针一样的结晶，为什么会突然痛得走不了路，又该怎样把它赶走。</p>
  </header>

  <div class="stage">
    <canvas id="cv" aria-label="卡通大脚趾关节剖面动画"></canvas>
    <div class="bar"><i id="prog"></i></div>
  </div>

  <div class="below">
    <ol class="chapters" id="chapters"></ol>
    <section class="narr" aria-live="polite">
      <h2 id="nTitle"></h2>
      <p id="nText"></p>
      <div class="fact" id="nFact"></div>
      <div class="controls">
        <button id="prev" type="button">上一幕</button>
        <button id="play" type="button" class="primary">暂停</button>
        <button id="next" type="button">下一幕</button>
      </div>
    </section>
  </div>

  <footer>科普示意动画，比例和形象都经过卡通化处理，不能替代医生的诊断和建议。痛风发作或尿酸偏高，请到风湿免疫科或内分泌科就诊。</footer>
</div>

<script id="video-meta" type="application/json">
{
  "intro": "痛风发作时，为什么会痛得走不了路？跟着尿酸小分子，一起去大脚趾的关节里看看吧。",
  "spoken": { "μmol/L": "微摩尔每升" },
  "sad": [3, 4, 5]
}
</script>
<script src="../shared/engine.js"></script>
<script src="scene.js"></script>
</body>
</html>
