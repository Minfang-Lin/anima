<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>一夜的旅行</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<link rel="stylesheet" href="../shared/style.css">
</head>
<body data-episode="sleep-cycle">
<div class="wrap">
  <header id="epHeader"></header>

  <div class="stage">
    <canvas id="cv" aria-label="科普动画"></canvas>
    <div class="bar"><i id="prog"></i></div>
  </div>

  <div class="below">
    <ol class="chapters" id="chapters"></ol>
    <section class="narr" aria-live="polite">
      <h2 id="nTitle"></h2>
      <p id="nText"></p>
      <div class="fact" id="nFact"></div>
      <div class="controls">
        <button id="prev" type="button">上一幕</button>
        <button id="play" type="button" class="primary">暂停</button>
        <button id="next" type="button">下一幕</button>
      </div>
    </section>
  </div>

  <footer id="epFooter"></footer>
</div>

<script id="video-meta" type="application/json">
{
  "intro": "睡着以后，大脑真的在休息吗？跟着一张整夜睡眠图，一起去夜里的大脑看看吧。",

    "β-淀粉样蛋白": "贝塔淀粉样蛋白",
    "20%～25%": "百分之二十到二十五",
    "7～9 小时": "七到九小时",
    "4～6": "四到六"
  },
  "sad": []
}
</script>
<script src="../shared/engine.js"></script>
<script src="../shared/textbook.js"></script>
<script src="scene.js"></script>
</body>
</html>
