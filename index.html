<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>身体小剧场</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<link rel="stylesheet" href="shared/style.css">
<link rel="stylesheet" href="shared/hub.css">
</head>
<body>
<div class="wrap">

  <!-- 展厅首页 -->
  <section id="home" class="home">
    <header>
      <span class="tag">身体小剧场 · 互动展厅</span>
      <h1>身体里在<em>上演</em>什么？</h1>
      <p class="lede">像逛博物馆一样，点一点身体的各个部位，每个部位都藏着一出小剧场。会发光的部位已经开演，灰色的还在筹备中。</p>
      <p class="count" id="count"></p>
    </header>

    <div class="tabs" role="tablist" aria-label="浏览方式">
      <button type="button" role="tab" id="tabBody" aria-selected="true" aria-controls="panelBody">按部位</button>
      <button type="button" role="tab" id="tabDisease" aria-selected="false" aria-controls="panelDisease">按病种</button>
    </div>

    <div id="panelBody" role="tabpanel" aria-labelledby="tabBody" class="panel">
      <svg id="body" class="body" viewBox="0 0 420 660" role="group" aria-label="人体示意图，点击器官查看小剧场">
        <defs>
          <linearGradient id="skinShade" x1="0" x2="1">
            <stop offset="0" stop-color="#e9bfa6"/><stop offset=".35" stop-color="#f6d8c4"/>
            <stop offset=".65" stop-color="#f6d8c4"/><stop offset="1" stop-color="#e9bfa6"/>
          </linearGradient>
        </defs>

          <path d="M272.0 128.0 C274.3 121.3 287.3 132.7 292.0 140.0 C296.7 147.3 298.0 159.7 300.0 172.0 C302.0 184.3 302.3 199.7 304.0 214.0 C305.7 228.3 307.7 242.7 310.0 258.0 C312.3 273.3 315.7 291.7 318.0 306.0 C320.3 320.3 321.7 333.0 324.0 344.0 C326.3 355.0 331.0 363.0 332.0 372.0 C333.0 381.0 332.0 392.7 330.0 398.0 C328.0 403.3 323.0 405.3 320.0 404.0 C317.0 402.7 313.7 397.7 312.0 390.0 C310.3 382.3 311.3 370.0 310.0 358.0 C308.7 346.0 306.7 332.7 304.0 318.0 C301.3 303.3 297.0 285.3 294.0 270.0 C291.0 254.7 288.7 241.0 286.0 226.0 C283.3 211.0 280.3 196.3 278.0 180.0 C275.7 163.7 269.7 134.7 272.0 128.0 Z"/>

          <ellipse cx="176" cy="60" rx="5" ry="10"/><ellipse cx="244" cy="60" rx="5" ry="10"/>
          <path d="M210 14 C236 14 244 36 243 58 C242 80 230 98 210 98 C190 98 178 80 177 58 C176 36 184 14 210 14 Z"/>
        </g>
        <g class="contour" aria-hidden="true">
          <path d="M174 132 C188 138 200 136 208 132 M246 132 C232 138 220 136 212 132"/>
          <path d="M210 150 L210 230"/>
          <path d="M160 474 C168 470 176 472 182 478 M260 474 C252 470 244 472 238 478"/>
          <circle cx="210" cy="286" r="2.4"/>
        </g>
        <!-- 血管：主动脉从心脏往下，分到两条腿；锁骨下动脉进两条胳膊 -->
        <g class="organ" data-organ="vessels">
          <path class="hit" d="M216 214 L214 334 L186 372 L178 600 M214 334 L234 372 L242 600 M196 150 L140 150 L124 250 L106 340 M224 150 L280 150 L296 250 L314 340"/>
          <path class="vessel" d="M216 214 C214 250 214 300 214 334 C200 350 188 360 184 380 C180 450 178 540 180 600 M214 334 C226 350 232 362 236 380 C240 450 242 540 240 600"/>
          <path class="vessel" d="M210 170 C200 156 176 150 150 152 C130 170 126 210 122 250 C116 290 108 320 102 346 M216 170 C226 156 246 150 270 152 C290 170 294 210 298 250 C304 290 312 320 318 346"/>
          <path class="vein" d="M204 214 C204 250 204 300 204 334 C194 350 178 362 174 380 C170 450 170 540 172 600 M206 334 C216 352 222 364 226 380 C230 450 232 540 232 600"/>
        </g>
        <!-- 大脑 -->
        <g class="organ" data-organ="brain">
          <path class="fill-brain" d="M184 50 C182 30 196 20 210 22 C226 20 240 30 237 50 C238 62 226 68 210 67 C194 68 182 62 184 50 Z"/>
          <path class="fold" d="M198 26 C202 36 194 42 200 52 M214 24 C210 34 220 40 214 52 M228 32 C224 40 232 46 226 56 M192 44 C198 50 192 58 198 62"/>
        </g>
        <!-- 肺 -->
        <g class="organ" data-organ="lungs">
          <path class="fill-lungs" d="M190 152 C172 156 160 184 158 214 C156 236 170 244 188 238 C200 234 204 216 204 194 C204 170 200 152 190 152 Z"/>
          <path class="fill-lungs" d="M230 152 C248 156 262 184 264 214 C266 236 252 244 236 240 C228 238 226 226 230 214 C218 206 216 176 222 160 C224 154 226 152 230 152 Z"/>
        </g>
        <!-- 心脏：胸口正中偏左（画面偏右） -->
        <g class="organ" data-organ="heart">
          <path class="fill-heart" d="M222 238 C204 228 198 212 204 202 C208 194 218 194 222 202 C228 192 240 194 242 204 C244 216 236 230 222 238 Z"/>
        </g>
        <!-- 肝脏：右上腹（画面左侧） -->
        <g class="organ" data-organ="liver">
          <path class="fill-liver" d="M158 250 C160 238 184 234 214 238 C230 240 236 248 228 258 C216 272 182 284 166 278 C158 274 156 262 158 250 Z"/>
        </g>
        <!-- 胃：左上腹（画面右侧） -->
        <g class="organ" data-organ="stomach">
          <path class="fill-stomach" d="M232 244 C248 236 266 248 262 268 C258 286 238 292 228 282 C222 276 230 270 230 262 C230 256 226 250 232 244 Z"/>
        </g>
        <!-- 胰腺 -->
        <g class="organ" data-organ="pancreas">
          <path class="fill-pancreas" d="M190 292 C204 284 236 284 252 290 C248 300 214 302 190 298 Z"/>
        </g>
        <!-- 肾脏 -->
        <g class="organ" data-organ="kidney">
          <path class="fill-kidney" d="M180 300 C168 300 166 326 178 332 C186 336 190 326 186 318 C184 312 190 306 186 302 C184 300 182 300 180 300 Z"/>
          <path class="fill-kidney" d="M240 300 C252 300 254 326 242 332 C234 336 230 326 234 318 C236 312 230 306 234 302 C236 300 238 300 240 300 Z"/>
        </g>
        <!-- 骨骼：左大腿里的股骨（画面右侧） -->
        <g class="organ" data-organ="bone">
          <path class="fill-bone" d="M234 352 C228 344 234 336 241 340 C245 334 254 338 250 346 L246 460 C252 468 244 476 239 470 C233 476 224 468 231 460 Z"/>
        </g>
        <!-- 脚趾关节：右脚的大脚趾（画面左侧，靠内） -->
        <g class="organ" data-organ="joint">
          <circle class="fill-joint" cx="191" cy="640" r="9"/>
        </g>

        <!-- 标签由 hub.js 按目录生成 -->
        <g id="labels"></g>
      </svg>
      <p class="hint">点器官或旁边的标签都可以</p>
    </div>

    <div id="panelDisease" role="tabpanel" aria-labelledby="tabDisease" class="panel" hidden>
      <div id="diseaseList" class="disease-list"></div>
    </div>

    <footer>科普示意动画，比例和形象都经过卡通化处理，不能替代医生的诊断和建议。</footer>
  </section>

  <!-- 播放某一集 -->
  <section id="episode" hidden>
    <button type="button" id="back" class="back">← 回到展厅</button>
    <header id="epHeader"></header>

    <div class="stage">
      <canvas id="cv" aria-label="科普动画"></canvas>
      <div class="bar"><i id="prog"></i></div>
    </div>

    <div class="below">
      <ol class="chapters" id="chapters"></ol>
      <section class="narr" aria-live="polite">
        <h2 id="nTitle"></h2>
        <p id="nText"></p>
        <div class="fact" id="nFact"></div>
        <div class="controls">
          <button id="prev" type="button">上一幕</button>
          <button id="play" type="button" class="primary">暂停</button>
          <button id="next" type="button">下一幕</button>
        </div>
      </section>
    </div>

    <footer id="epFooter"></footer>
  </section>
</div>

<!-- 展签：点器官后从底部弹出 -->
<div id="sheet" class="sheet" hidden>
  <div class="sheet-backdrop" id="sheetBackdrop"></div>
  <div class="sheet-card" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <button type="button" id="sheetClose" class="sheet-close" aria-label="关闭">×</button>
    <h2 id="sheetTitle"></h2>
    <p id="sheetFact" class="sheet-fact"></p>
    <ul id="sheetList" class="ep-list"></ul>
  </div>
</div>

<script src="shared/engine.js"></script>
<script src="shared/textbook.js"></script>
<!-- 每一集：新做好的小剧场在这里加一行 -->
<script src="diabetes-vessels/scene.js"></script>
<script src="gout/scene.js"></script>
<script src="fatty-liver/scene.js"></script>
<script src="lipids/scene.js"></script>
<script src="osteoporosis/scene.js"></script>
<script src="insulin/scene.js"></script>
<script src="hypertension/scene.js"></script>
<script src="heart-attack/scene.js"></script>
<script src="stroke/scene.js"></script>
<script src="ckd/scene.js"></script>
<script src="smoking-lungs/scene.js"></script>
<script src="alcohol-liver/scene.js"></script>
<script src="h-pylori/scene.js"></script>
<script src="sleep-drive/scene.js"></script>
<script src="sleep-cycle/scene.js"></script>
<script src="premature-beats/scene.js"></script>
<script src="heart-valves/scene.js"></script>
<script src="shared/catalog.js"></script>
<script src="shared/hub.js"></script>
</body>
</html>
