<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>肝里的油</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
/* 绘本风：只有一套浅色配色，所有颜色都显式指定 */
:root {
  color-scheme: light;
  --ground: #fff1ee;
  --paper: #ffffff;
  --ink: #5b3a4a;
  --soft: #9a7885;
  --coral: #ff7b7b;
  --sugar: #ffc94d;
  --mint: #6cc9ae;
  --blush: #ffd3d0;
  --round: "ZCOOL KuaiLe", "Yuanti SC", "YouYuan", "PingFang SC", sans-serif;
  --sans: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--ground);
  background-image: radial-gradient(#ffdcd6 1.6px, transparent 1.6px);
  background-size: 22px 22px;
  color: var(--ink);
  font: 15px/1.8 var(--sans);
  padding-inline: 16px;
  padding-block: 28px 48px;
}
.wrap { max-width: 1080px; margin: 0 auto; display: grid; gap: 22px; }
header { display: grid; gap: 8px; }
.tag {
  justify-self: start; font: 16px/1 var(--round); color: var(--paper); background: var(--mint);
  padding: 6px 14px; border-radius: 999px; border: 2.5px solid var(--ink);
}
h1 { font: 400 clamp(30px, 5.4vw, 50px)/1.2 var(--round); margin: 0; text-wrap: balance; letter-spacing: .02em; }
h1 em { font-style: normal; color: var(--coral); }
.lede { margin: 0; color: var(--soft); max-width: 62ch; }

.stage {
  position: relative; border-radius: 26px; overflow: hidden;
  background: #ffe7e3; border: 3px solid var(--ink); box-shadow: 6px 6px 0 var(--ink);
}
canvas { display: block; width: 100%; height: auto; aspect-ratio: 16 / 9; max-width: 100%; }
.bar { height: 8px; background: #ffd9d3; border-top: 3px solid var(--ink); }
.bar i { display: block; height: 100%; width: 0; background: var(--mint); }

.below { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr); gap: 22px; align-items: start; }
@media (max-width: 760px) { .below { grid-template-columns: 1fr; } }

ol.chapters { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
ol.chapters button {
  width: 100%; text-align: left; display: flex; gap: 10px; align-items: center;
  background: transparent; color: var(--soft); border: 2.5px solid transparent; border-radius: 16px;
  padding: 6px 10px; font: 17px/1.3 var(--round); cursor: pointer;
}
ol.chapters button span {
  flex: none; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center;
  background: var(--blush); color: var(--ink); font: 15px/1 var(--round);
}
ol.chapters button:hover { color: var(--ink); background: var(--paper); }
ol.chapters button[aria-current="step"] { background: var(--paper); color: var(--ink); border-color: var(--ink); }
ol.chapters button[aria-current="step"] span { background: var(--coral); color: var(--paper); }
button:focus-visible { outline: 3px solid var(--mint); outline-offset: 2px; }

.narr {
  display: grid; gap: 12px; background: var(--paper); border-radius: 22px;
  border: 3px solid var(--ink); box-shadow: 5px 5px 0 var(--ink); padding: 18px 22px;
}
.narr h2 { margin: 0; font: 400 26px/1.3 var(--round); }
.narr p { margin: 0; max-width: 62ch; }
.fact {
  font-size: 14px; line-height: 1.6; background: #fff6da; border-radius: 14px;
  padding: 8px 12px; border: 2px dashed var(--sugar);
}
.controls { display: flex; gap: 10px; flex-wrap: wrap; }
.controls button {
  background: var(--paper); color: var(--ink); border: 2.5px solid var(--ink); border-radius: 999px;
  padding: 5px 16px; font: 17px var(--round); cursor: pointer; box-shadow: 3px 3px 0 var(--ink);
}
.controls button:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }
.controls button.primary { background: var(--coral); color: var(--paper); }
footer { color: var(--soft); font-size: 13px; }
@media (prefers-reduced-motion: reduce) { .controls button:active { transform: none; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="tag">肝脏小剧场 · 7 幕</span>
    <h1><em>瘦</em>人也会得脂肪肝？</h1>
    <p class="lede">走进肝脏看一看：脂肪从哪里来，为什么体重正常的人也会囤油，脂肪肝怎样一步步变成肝硬化，以及怎样把它逆转回来。</p>
  </header>

  <div class="stage">
    <canvas id="cv" aria-label="卡通肝细胞动画"></canvas>
    <div class="bar"><i id="prog"></i></div>
  </div>

  <div class="below">
    <ol class="chapters" id="chapters"></ol>
    <section class="narr" aria-live="polite">
      <h2 id="nTitle"></h2>
      <p id="nText"></p>
      <div class="fact" id="nFact"></div>
      <div class="controls">
        <button id="prev" type="button">上一幕</button>
        <button id="play" type="button" class="primary">暂停</button>
        <button id="next" type="button">下一幕</button>
      </div>
    </section>
  </div>

  <footer>科普示意动画，比例和形象都经过卡通化处理，不能替代医生的诊断和建议。体检发现脂肪肝，请到消化内科或肝病科进一步评估。</footer>
</div>

<script id="video-meta" type="application/json">
{
  "intro": "明明不胖，体检却查出了脂肪肝？跟着肝细胞小伙伴，一起去肝脏里看看吧。",
  "spoken": {
    "5% 到 10%": "百分之五到百分之十",
    "3% 到 5%": "百分之三到百分之五",
    "超过 5%": "超过百分之五",
    "B 超": "B超"
  },
  "sad": [3, 4, 5]
}
</script>
<script>
// 科普动画共用引擎：绘本风画笔、章节切换、网页播放和逐帧录制。
// 每个主题页面只需要提供章节数据、状态、update() 和 draw()，然后调用 Anima.start(...)。
(() => {
  // 共用配色（主题可以往里加自己的颜色）
  const C = {
    ink: "#5b3a4a", paper: "#ffffff", soft: "#9a7885", mint: "#6cc9ae", coral: "#ff7b7b",
    sugar: "#ffc94d", blush: "#ff9fb0", ros: "#8b7cf6", tissue: "#ffe7e3", dot: "#ffd6cf",
  };
  const ROUND = '"ZCOOL KuaiLe", "Yuanti SC", "YouYuan", "PingFang SC", sans-serif';
  const SANS = '"Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif';

  const cv = document.getElementById("cv");
  const ctx = cv.getContext("2d");
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

  // 录制模式（record.js 注入 window.__RECORD / __RATIO / __TIMELINE）：固定尺寸画布，逐帧手动推进
  const REC = window.__RECORD === true;
  const LAYOUTS = {
    // VW×VH 视频尺寸；舞台左上角 (SX, SY)、大小 SW×SH；K 为舞台缩放；UI 为标注字号倍数
    "16:9": { VW: 1920, VH: 1080, SX: 240, SY: 36, SW: 1440, SH: 810, K: 1, UI: 1 },
    "3:4": { VW: 1080, VH: 1440, SX: 40, SY: 150, SW: 1000, SH: 820, K: 1.3, UI: 1.7 },
  };
  const LY = LAYOUTS[window.__RATIO] || LAYOUTS["16:9"];
  const { VW, VH, SX, SY } = LY;
  const UI = REC ? LY.UI : 1;

  let W = 0, H = 0, time = 0, cur = 0;
  const labelAlpha = {};

  // ---------- 小工具 ----------
  const rnd = (i) => { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
  const lerp = (a, b, t) => a + (b - a) * t;
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const mix = (h1, h2, t) => {
    const a = parseInt(h1.slice(1), 16), b = parseInt(h2.slice(1), 16);
    const c = (s) => Math.round(lerp((a >> s) & 255, (b >> s) & 255, clamp(t, 0, 1)));
    return `rgb(${c(16)},${c(8)},${c(0)})`;
  };

  // ---------- 绘本风画笔 ----------
  function outline(w = 2.5) { ctx.strokeStyle = C.ink; ctx.lineWidth = w; ctx.lineJoin = "round"; ctx.lineCap = "round"; }
  function rrect(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
  // mood: 1 开心，0 平静，-1 难过
  function face(x, y, s, mood, blush = true) {
    ctx.fillStyle = C.ink;
    const blink = (Math.sin(time * 1.3 + x * 0.05) > 0.985) ? 0.25 : 1;
    ctx.beginPath(); ctx.ellipse(x - s * 0.32, y - s * 0.08, s * 0.1, s * 0.13 * blink, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(x + s * 0.32, y - s * 0.08, s * 0.1, s * 0.13 * blink, 0, 0, Math.PI * 2); ctx.fill();
    if (blush) {
      ctx.fillStyle = "rgba(255,159,176,0.8)";
      ctx.beginPath(); ctx.ellipse(x - s * 0.55, y + s * 0.18, s * 0.14, s * 0.08, 0, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(x + s * 0.55, y + s * 0.18, s * 0.14, s * 0.08, 0, 0, Math.PI * 2); ctx.fill();
    }
    outline(Math.max(1.2, s * 0.09));
    ctx.beginPath();
    ctx.moveTo(x - s * 0.2, y + s * 0.2);
    ctx.quadraticCurveTo(x, y + s * 0.2 + s * 0.28 * mood, x + s * 0.2, y + s * 0.2);
    ctx.stroke();
  }
  // 汗珠，(x, y) 是水滴顶端
  function sweat(x, y, s) {
    ctx.fillStyle = "#9fd8ff";
    ctx.beginPath(); ctx.moveTo(x, y); ctx.quadraticCurveTo(x + s * 0.6, y + s * 0.9, x, y + s);
    ctx.quadraticCurveTo(x - s * 0.5, y + s * 0.7, x, y); ctx.fill(); outline(1.2); ctx.stroke();
  }
  function heart(x, y, s, color) {
    ctx.beginPath();
    ctx.moveTo(x, y + s * 0.7);
    ctx.bezierCurveTo(x - s * 1.2, y - s * 0.1, x - s * 0.5, y - s * 0.9, x, y - s * 0.3);
    ctx.bezierCurveTo(x + s * 0.5, y - s * 0.9, x + s * 1.2, y - s * 0.1, x, y + s * 0.7);
    ctx.fillStyle = color; ctx.fill(); outline(1.8); ctx.stroke();
  }
  function bolt(x, y, s, a, color = C.ros) {
    ctx.save(); ctx.globalAlpha *= a; ctx.translate(x, y);
    ctx.beginPath();
    ctx.moveTo(-s * 0.2, -s); ctx.lineTo(s * 0.45, -s * 0.15); ctx.lineTo(0, -s * 0.05);
    ctx.lineTo(s * 0.25, s); ctx.lineTo(-s * 0.45, s * 0.05); ctx.lineTo(0, -s * 0.02); ctx.closePath();
    ctx.fillStyle = color; ctx.fill(); outline(1.6); ctx.stroke();
    ctx.restore();
  }
  // 圆点背景
  function dots(n, color, seed = 30) {
    ctx.fillStyle = color;
    for (let i = 0; i < n; i++) { ctx.beginPath(); ctx.arc(rnd(i + seed) * W, rnd(i + seed + 30) * H, 3 + rnd(i) * 4, 0, Math.PI * 2); ctx.fill(); }
  }

  // 对话框标注：key 用来记住淡入淡出，(tx, ty) 指向的点，(lx, ly) 气泡位置
  function callout(key, on, tx, ty, lx, ly, text) {
    const a = labelAlpha[key] = lerp(labelAlpha[key] || 0, on ? 1 : 0, 0.08);
    if (a < 0.02) return;
    ctx.save();
    ctx.globalAlpha *= a;
    const fs = Math.max(12, W / 56) * UI;
    ctx.font = `${fs}px ${ROUND}`;
    const w = ctx.measureText(text).width + 22, bh = fs + 14;
    const bx = clamp(lx - w / 2, 6, W - w - 6), by = clamp(ly < ty ? ly - bh : ly, 6, H - bh - 6);
    outline(2);
    ctx.setLineDash([4, 4]);
    ctx.beginPath(); ctx.moveTo(tx, ty); ctx.lineTo(clamp(lx, bx + 12, bx + w - 12), ly < ty ? by + bh : by); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = C.paper;
    ctx.beginPath(); ctx.arc(tx, ty, 4, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    rrect(bx, by, w, bh, bh / 2); ctx.fill(); outline(2.5); ctx.stroke();
    ctx.fillStyle = C.ink; ctx.textBaseline = "middle";
    ctx.fillText(text, bx + 11, by + bh / 2 + 1);
    ctx.restore();
  }

  // 角落里的数值胶囊
  function pill(x, y, label, value, color, alignRight) {
    const fs = Math.max(12, W / 60) * UI;
    ctx.font = `${fs}px ${ROUND}`;
    const t1 = ctx.measureText(label).width;
    ctx.font = `${fs * 1.4}px ${ROUND}`;
    const t2 = ctx.measureText(value).width;
    const w = t1 + t2 + 34, h = fs * 1.4 + 14;
    const bx = alignRight ? x - w : x;
    rrect(bx, y, w, h, h / 2); ctx.fillStyle = C.paper; ctx.fill(); outline(2.5); ctx.stroke();
    ctx.textBaseline = "middle";
    ctx.font = `${fs}px ${ROUND}`; ctx.fillStyle = C.soft; ctx.fillText(label, bx + 14, y + h / 2 + 1);
    ctx.font = `${fs * 1.4}px ${ROUND}`; ctx.fillStyle = color; ctx.fillText(value, bx + 20 + t1, y + h / 2 + 1);
  }

  function wrapText(text, maxW) {
    const lines = []; let line = "";
    for (const ch of text) {
      // 标点不放在行首
      if (ctx.measureText(line + ch).width > maxW && line && !"，。、；：！？）》”".includes(ch)) { lines.push(line); line = ch; } else line += ch;
    }
    if (line) lines.push(line);
    return lines;
  }

  // ---------- 启动 ----------
  function start(cfg) {
    const CH = cfg.chapters, S = cfg.state, DUR = cfg.dur || 11;
    const accent = cfg.accent || C.coral;
    let chT = 0, playing = !reduce;
    const sync = () => cfg.sync({ W, H, time, cur });

    function resize() {
      if (REC) { W = LY.SW / LY.K; H = LY.SH / LY.K; cv.width = VW; cv.height = VH; }
      else {
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        W = cv.clientWidth; H = W * 9 / 16;
        cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }
      sync();
    }
    addEventListener("resize", resize); resize();

    function update(dt) {
      const tgt = CH[cur];
      const k = 1 - Math.exp(-dt * 1.4);
      for (const key of Object.keys(S)) if (key in tgt) S[key] = lerp(S[key], tgt[key], k);
      sync();
      cfg.update(dt);
    }
    function draw() { ctx.globalAlpha = 1; sync(); cfg.draw(); }

    // 界面
    const list = document.getElementById("chapters");
    CH.forEach((c, i) => {
      const li = document.createElement("li");
      const b = document.createElement("button");
      b.type = "button"; b.id = "ch" + i;
      b.innerHTML = `<span>${i + 1}</span>${c.title}`;
      b.addEventListener("click", () => go(i));
      li.appendChild(b); list.appendChild(li);
    });
    const playBtn = document.getElementById("play");
    function go(i) {
      cur = (i + CH.length) % CH.length; chT = 0;
      const c = CH[cur];
      document.getElementById("nTitle").textContent = c.title;
      document.getElementById("nText").textContent = c.text;
      document.getElementById("nFact").textContent = c.fact;
      list.querySelectorAll("button").forEach((b, j) => { if (j === cur) b.setAttribute("aria-current", "step"); else b.removeAttribute("aria-current"); });
      sync();
    }
    document.getElementById("prev").onclick = () => go(cur - 1);
    document.getElementById("next").onclick = () => go(cur + 1);
    playBtn.onclick = () => { playing = !playing; playBtn.textContent = playing ? "暂停" : "播放"; };
    playBtn.textContent = playing ? "暂停" : "播放";
    addEventListener("keydown", (e) => {
      if (e.key === "ArrowRight") go(cur + 1);
      if (e.key === "ArrowLeft") go(cur - 1);
      if (e.key === " " && e.target === document.body) { e.preventDefault(); playBtn.click(); }
    });
    go(0);

    // 录制画面：舞台 + 片头 + 字幕卡
    function renderVideo() {
      const SW = LY.SW, SH = LY.SH, portrait = VH > VW, c = CH[cur];
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.fillStyle = "#fff1ee"; ctx.fillRect(0, 0, VW, VH);
      ctx.fillStyle = "#ffdcd6";
      for (let y = 11; y < VH; y += 22) for (let x = 11; x < VW; x += 22) { ctx.beginPath(); ctx.arc(x, y, 1.6, 0, Math.PI * 2); ctx.fill(); }
      ctx.fillStyle = C.ink; rrect(SX + 8, SY + 8, SW, SH, 36); ctx.fill();
      ctx.save(); ctx.translate(SX, SY); rrect(0, 0, SW, SH, 36); ctx.clip(); ctx.scale(LY.K, LY.K);
      draw();
      const titleT = window.__TIMELINE ? window.__TIMELINE.intro : 2.5;
      const ta = time < titleT ? 1 : clamp(1 - (time - titleT), 0, 1);
      if (ta > 0) {
        ctx.globalAlpha = ta;
        ctx.fillStyle = "rgba(255,241,238,0.92)"; ctx.fillRect(0, 0, W, H);
        ctx.fillStyle = C.ink; ctx.textAlign = "center"; ctx.textBaseline = "middle";
        const lines = portrait ? cfg.titleCard.lines : [cfg.titleCard.lines.join("")];
        const fs = portrait ? 62 : 72;
        ctx.font = `${fs}px ${ROUND}`;
        lines.forEach((ln, i) => ctx.fillText(ln, W / 2, H / 2 - 30 - (lines.length - 1 - i) * fs * 1.25));
        ctx.font = `${fs * 0.47}px ${ROUND}`; ctx.fillStyle = C.soft; ctx.fillText(cfg.titleCard.sub, W / 2, H / 2 + 50);
        ctx.textAlign = "left"; ctx.globalAlpha = 1;
      }
      ctx.restore();
      outline(4); rrect(SX, SY, SW, SH, 36); ctx.stroke();

      ctx.textBaseline = "middle";
      const badgeAt = (x, y, fs) => {
        ctx.font = `${fs}px ${ROUND}`;
        const badge = `第 ${cur + 1} 幕`, bw = ctx.measureText(badge).width + fs * 1.1, bh = fs * 1.6;
        rrect(x, y - bh / 2, bw, bh, bh / 2); ctx.fillStyle = accent; ctx.fill(); outline(3); ctx.stroke();
        ctx.fillStyle = C.paper; ctx.fillText(badge, x + fs * 0.55, y + 1);
        return bw;
      };
      if (!portrait) {
        const cy0 = SY + SH + 26, ch = VH - cy0 - 22;
        ctx.fillStyle = C.ink; rrect(SX + 6, cy0 + 6, SW, ch, 28); ctx.fill();
        ctx.fillStyle = C.paper; rrect(SX, cy0, SW, ch, 28); ctx.fill(); outline(4); ctx.stroke();
        const bw = badgeAt(SX + 26, cy0 + 43, 28);
        ctx.fillStyle = C.ink; ctx.font = `36px ${ROUND}`; ctx.fillText(c.title, SX + 46 + bw, cy0 + 43);
        ctx.font = `24px ${SANS}`;
        wrapText(c.text, SW - 56).slice(0, 3).forEach((ln, i) => ctx.fillText(ln, SX + 28, cy0 + 90 + i * 34));
        return;
      }
      const bw = badgeAt(SX, 78, 34);
      ctx.fillStyle = C.ink; ctx.font = `50px ${ROUND}`;
      ctx.fillText(c.title, SX + bw + 20, 80);
      const cy0 = SY + SH + 34, ch = VH - cy0 - 40;
      ctx.fillStyle = C.ink; rrect(SX + 8, cy0 + 8, SW, ch, 32); ctx.fill();
      ctx.fillStyle = C.paper; rrect(SX, cy0, SW, ch, 32); ctx.fill(); outline(4); ctx.stroke();
      ctx.fillStyle = C.ink; ctx.font = `35px ${SANS}`;
      wrapText(c.text, SW - 70).slice(0, 5).forEach((ln, i) => ctx.fillText(ln, SX + 35, cy0 + 52 + i * 52));
      ctx.font = `26px ${SANS}`;
      const fy = cy0 + ch - 58;
      rrect(SX + 28, fy - 26, SW - 56, 52, 18); ctx.fillStyle = "#fff6da"; ctx.fill();
      ctx.strokeStyle = C.sugar; ctx.lineWidth = 2.5; ctx.setLineDash([8, 6]); ctx.stroke(); ctx.setLineDash([]);
      ctx.fillStyle = C.ink; ctx.fillText(wrapText(c.fact, SW - 90)[0], SX + 45, fy + 1);
    }

    const prog = document.getElementById("prog");
    if (REC) {
      // 由 record.js 调用：每次推进一帧并画出来；有配音时每幕时长跟着 __TIMELINE 走
      const TL = window.__TIMELINE;
      const durs = TL ? TL.durs : CH.map(() => DUR);
      window.__rec = {
        total: durs.reduce((a, b) => a + b, 0),
        tick(dt) {
          time += dt; chT += dt;
          if (chT > durs[cur] && cur < CH.length - 1) { const over = chT - durs[cur]; go(cur + 1); chT = over; }
          update(dt); renderVideo();
        },
      };
      return;
    }
    let last = performance.now();
    function frame(now) {
      const dt = Math.min(0.05, (now - last) / 1000); last = now;
      time += dt;
      if (playing) { chT += dt; if (chT > DUR) go(cur + 1); }
      prog.style.width = (chT / DUR * 100).toFixed(2) + "%";
      update(dt);
      draw();
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  }

  window.Anima = {
    ctx, C, ROUND, SANS, UI, rnd, lerp, clamp, mix,
    outline, rrect, face, sweat, heart, bolt, dots, callout, pill, start,
  };
})();
</script>
<script>
(() => {
  const CH = [
    { title: "健康的肝脏", fat: 0.05, sugar: 0.2, trucks: 1, lean: 0, inflame: 0, fibro: 0, heal: 0,
      text: "肝脏是身体的化工厂，由一个个肝细胞组成。它们把吃进来的糖和脂肪加工、储存，再用“小货车”把多余的脂肪运出去。健康的肝细胞里只有很少一点脂肪。",
      fact: "正常肝脏里的脂肪不到 5%",
      labels: ["cell", "truck"] },
    { title: "肝里的油从哪里来", fat: 0.35, sugar: 1, trucks: 1, lean: 0, inflame: 0, fibro: 0, heal: 0,
      text: "肝里的脂肪有三个来源：肚子里的脂肪分解后流进肝脏，吃进去的油脂，还有吃多了的糖。特别是含糖饮料里的果糖，会在肝脏里直接变成脂肪。进来的多、运出去的少，油就在肝细胞里堆起来了。",
      fact: "果糖几乎全部在肝脏里代谢，常喝甜饮料是脂肪肝的重要推手",
      labels: ["soda", "bellyfat", "droplet"] },
    { title: "瘦人为什么也会得", fat: 0.55, sugar: 1, trucks: 0.35, lean: 1, inflame: 0, fibro: 0, heal: 0,
      text: "体重正常不等于肝脏没事。经常喝甜饮料、久坐不动、肌肉少、脂肪藏在肚子里，都会让瘦人得脂肪肝。过度节食、蛋白质吃不够，运脂肪的小货车反而变少，油更运不出去。还有些人天生就更容易在肝里囤油。",
      fact: "约五分之一的脂肪肝患者体重正常，被称为“瘦人脂肪肝”",
      labels: ["lean", "fewtruck"] },
    { title: "油滴塞满了肝细胞", fat: 1, sugar: 0.8, trucks: 0.5, lean: 0, inflame: 0, fibro: 0, heal: 0,
      text: "油越积越多，小油滴汇成大油滴，把肝细胞塞得满满的，细胞核都被挤到了角落。肝脏里的脂肪超过 5%，就是脂肪肝。它最常在体检做 B 超时被发现，这时大多数人没有任何不舒服。",
      fact: "我国成年人脂肪肝的患病率接近三成",
      labels: ["big"] },
    { title: "发炎了：脂肪性肝炎", fat: 1, sugar: 0.8, trucks: 0.5, lean: 0, inflame: 1, fibro: 0.1, heal: 0,
      text: "塞满油的肝细胞压力越来越大，开始肿胀、受伤。免疫细胞赶来，引起炎症，这就是脂肪性肝炎。抽血时转氨酶可能会升高，但很多人依然没有感觉。",
      fact: "转氨酶正常，也不能完全排除脂肪性肝炎",
      labels: ["balloon", "immune"] },
    { title: "长出疤痕，肝脏变硬", fat: 0.8, sugar: 0.8, trucks: 0.5, lean: 0, inflame: 0.5, fibro: 1, heal: 0,
      text: "炎症反复发生，星状细胞就像补墙一样织出疤痕纤维，肝脏越来越硬，这就是肝纤维化。继续发展会变成肝硬化，甚至肝癌。肝脏里面没有痛觉神经，不痛不代表没事。",
      fact: "肝脏弹性检查（FibroScan）能无创地测出肝脏有多硬",
      labels: ["scar", "stellate"] },
    { title: "脂肪肝可以逆转", fat: 0.12, sugar: 0.2, trucks: 1, lean: 0, inflame: 0, fibro: 0.3, heal: 1,
      text: "好消息是，脂肪肝可以逆转，早期的纤维化也有机会减轻。少喝含糖饮料，少吃精米白面和油炸食物，吃够蛋白质，每周运动 150 分钟以上。超重的人减掉体重的 5% 到 10%，瘦人减掉 3% 到 5% 或者多运动，肝里的油就会明显减少。",
      fact: "建议每年体检查肝功能和 B 超，必要时做肝脏弹性检查",
      labels: ["shrink"] },
  ];
  const DUR = 11; // 每幕秒数

  const C = Object.assign(Anima.C, {
    vessel: "#ffb3b3", lumen: "#fff4ec", sinus: "#f9c4c4",
    cell: "#ffc4a3", cellPale: "#ffe6d6", cellScar: "#e9a88f", nucleus: "#f59a7c",
    oil: "#fff0a0", oilEdge: "#e8c24a", truck: "#8fd3b6", scar: "#a9826f", stellate: "#b89cf0",
    immune: "#ffffff", soda: "#ff8a8a", heartPink: "#ff9fb0",
  });
  const { ctx, rnd, clamp, mix, outline, rrect, face, sweat, heart, dots, callout, pill } = Anima;
  let W = 0, H = 0, time = 0, cur = 0;

  const S = { fat: 0.05, sugar: 0.2, trucks: 1, lean: 0, inflame: 0, fibro: 0, heal: 0 };

  // ---------- 几何 ----------
  const V = () => ({ y0: H * 0.105, y1: H * 0.285, mid: H * 0.195, h: H * 0.09 });
  const P = () => H * 0.215;                 // 肝细胞间距
  const gridTop = () => H * 0.315;
  function cellAt(r, c) {
    const p = P();
    const x = (c + 0.5 + (r % 2) * 0.5) * p * 1.04 - p * 0.35;
    const y = gridTop() + (r + 0.5) * p;
    const id = r * 100 + c;
    const ballooned = rnd(id + 11) < 0.45;
    const bal = S.inflame * (ballooned ? 1 : 0.15);
    const f = clamp(S.fat * (0.55 + rnd(id + 7) * 0.9), 0, 1);
    const h = p * 0.45 * (1 + 0.14 * bal - 0.12 * S.fibro);
    return { x, y, h, id, f, bal, ballooned, rot: (rnd(id + 3) - 0.5) * 0.25 };
  }
  const cols = () => Math.ceil(W / (P() * 1.04)) + 1;

  // ---------- 粒子 ----------
  const rbcs = Array.from({ length: 6 }, (_, i) => ({ x: i / 6 + rnd(i) * 0.05, yn: rnd(i + 20) - 0.5 }));
  const cubes = Array.from({ length: 22 }, (_, i) => ({ x: rnd(i + 40), yn: rnd(i + 70) * 1.6 - 0.8, ph: rnd(i + 90) * 6 }));
  const fats = Array.from({ length: 10 }, (_, i) => ({ x: rnd(i + 120), yn: rnd(i + 140) * 1.4 - 0.7 }));
  const sodas = Array.from({ length: 2 }, (_, i) => ({ x: i * 0.5 + 0.1 }));
  const trucks = Array.from({ length: 4 }, (_, i) => ({ x: i / 4 + 0.05 }));
  const immunes = Array.from({ length: 5 }, (_, i) => ({ k: i, ph: rnd(i + 170) * 6 }));
  const hearts = Array.from({ length: 8 }, (_, i) => ({ x: rnd(i + 8000), y: rnd(i + 8100), ph: rnd(i + 8200) * 6 }));

  function update(dt) {
    const sp = dt * 0.07 * (1 + 0.2 * Math.max(0, Math.sin(time * Math.PI * 2)));
    for (const a of [rbcs, cubes, fats, sodas]) for (const p of a) { p.x += sp; if (p.x > 1.05) p.x -= 1.1; }
    for (const t of trucks) { t.x += sp * 0.8; if (t.x > 1.05) t.x -= 1.1; }
  }

  // ---------- 小图标 ----------
  function sugarCube(x, y, s, rot) {
    ctx.save(); ctx.translate(x, y); ctx.rotate(Math.sin(rot) * 0.4);
    rrect(-s, -s, s * 2, s * 2, s * 0.5); ctx.fillStyle = C.sugar; ctx.fill(); outline(1.5); ctx.stroke();
    ctx.fillStyle = "rgba(255,255,255,0.8)"; ctx.beginPath(); ctx.arc(-s * 0.35, -s * 0.35, s * 0.28, 0, 6.3); ctx.fill();
    ctx.restore();
  }
  function oil(x, y, r) {
    ctx.beginPath(); ctx.arc(x, y, r, 0, 6.3); ctx.fillStyle = C.oil; ctx.fill();
    ctx.strokeStyle = C.oilEdge; ctx.lineWidth = Math.max(1.2, r * 0.12); ctx.stroke();
    ctx.fillStyle = "rgba(255,255,255,0.85)"; ctx.beginPath(); ctx.arc(x - r * 0.35, y - r * 0.35, r * 0.25, 0, 6.3); ctx.fill();
  }
  function soda(x, y, s) {
    ctx.save(); ctx.translate(x, y);
    ctx.beginPath(); ctx.moveTo(-s * 0.45, -s * 0.45); ctx.lineTo(s * 0.45, -s * 0.45); ctx.lineTo(s * 0.32, s * 0.6); ctx.lineTo(-s * 0.32, s * 0.6); ctx.closePath();
    ctx.fillStyle = C.soda; ctx.fill(); outline(1.8); ctx.stroke();
    outline(2); ctx.beginPath(); ctx.moveTo(s * 0.1, -s * 0.45); ctx.lineTo(s * 0.3, -s * 0.9); ctx.stroke();
    ctx.fillStyle = "rgba(255,255,255,0.7)"; ctx.fillRect(-s * 0.3, -s * 0.1, s * 0.6, s * 0.14);
    ctx.restore();
  }
  function truck(x, y, s) {
    ctx.save(); ctx.translate(x, y);
    rrect(-s, -s * 0.45, s * 1.35, s * 0.8, s * 0.2); ctx.fillStyle = C.truck; ctx.fill(); outline(1.8); ctx.stroke();
    rrect(s * 0.35, -s * 0.2, s * 0.6, s * 0.55, s * 0.15); ctx.fillStyle = C.truck; ctx.fill(); outline(1.8); ctx.stroke();
    ctx.fillStyle = "#e6fbff"; rrect(s * 0.55, -s * 0.1, s * 0.3, s * 0.22, s * 0.06); ctx.fill();
    oil(-s * 0.35, -s * 0.05, s * 0.3);
    for (const wx of [-s * 0.6, s * 0.6]) { ctx.beginPath(); ctx.arc(wx, s * 0.4, s * 0.18, 0, 6.3); ctx.fillStyle = C.ink; ctx.fill(); }
    ctx.restore();
  }
  function star(x, y, s, a) {
    ctx.save(); ctx.globalAlpha *= a; ctx.translate(x, y); ctx.rotate(time * 0.3);
    ctx.beginPath();
    for (let i = 0; i < 10; i++) { const r = i % 2 ? s * 0.45 : s; const t = i * Math.PI / 5; ctx[i ? "lineTo" : "moveTo"](Math.cos(t) * r, Math.sin(t) * r); }
    ctx.closePath(); ctx.fillStyle = C.stellate; ctx.fill(); outline(1.8); ctx.stroke();
    ctx.rotate(-time * 0.3); face(0, 0, s * 0.55, 0.2, false);
    ctx.restore();
  }

  // ---------- 场景 ----------
  function scene() {
    const v = V(), p = P();
    ctx.fillStyle = C.tissue; ctx.fillRect(0, 0, W, H);
    dots(20, C.dot);

    // 肝血窦（肝细胞之间的小血流）
    ctx.fillStyle = C.sinus; ctx.fillRect(0, gridTop() - 6, W, H);
    // 炎症光晕
    if (S.inflame > 0.02) {
      const pulse = 0.8 + 0.2 * Math.sin(time * 3.5);
      const rg = ctx.createRadialGradient(W * 0.5, H * 0.65, H * 0.05, W * 0.5, H * 0.65, W * 0.6);
      rg.addColorStop(0, `rgba(255,110,110,${0.45 * S.inflame * pulse})`); rg.addColorStop(1, "rgba(255,110,110,0)");
      ctx.fillStyle = rg; ctx.fillRect(0, gridTop() - 6, W, H);
    }

    // ---- 门静脉：血液带着糖、油和甜饮料流进肝脏 ----
    rrect(-20, v.y0, W + 40, v.y1 - v.y0, 0); ctx.fillStyle = C.vessel; ctx.fill();
    outline(3); ctx.beginPath(); ctx.moveTo(0, v.y0); ctx.lineTo(W, v.y0); ctx.moveTo(0, v.y1); ctx.lineTo(W, v.y1); ctx.stroke();
    const ins = (v.y1 - v.y0) * 0.15;
    ctx.fillStyle = mix(C.lumen, "#fff3c8", S.sugar * 0.7); ctx.fillRect(0, v.y0 + ins, W, v.y1 - v.y0 - ins * 2);
    const lh = v.h - ins;
    for (const r of rbcs) {
      const x = r.x * W, y = v.mid + r.yn * lh * 0.8, rr = lh * 0.42;
      ctx.beginPath(); ctx.ellipse(x, y, rr, rr * 0.8, 0, 0, 6.3); ctx.fillStyle = C.coral; ctx.fill(); outline(1.8); ctx.stroke();
      face(x, y + rr * 0.05, rr * 0.7, 0.8);
    }
    const nc = Math.round(clamp(S.sugar, 0, 1) * cubes.length);
    for (let i = 0; i < nc; i++) { const c = cubes[i]; sugarCube(c.x * W, v.mid + c.yn * lh * 0.85, Math.max(3.5, H * 0.011), time + c.ph); }
    const nf = Math.round(clamp(S.sugar, 0, 1) * fats.length);
    for (let i = 0; i < nf; i++) { const f = fats[i]; oil(f.x * W, v.mid + f.yn * lh * 0.8, Math.max(4, H * 0.014)); }
    if (S.sugar > 0.5) {
      ctx.save(); ctx.globalAlpha *= clamp((S.sugar - 0.5) * 2, 0, 1);
      for (const s of sodas) soda(s.x * W, v.mid, lh * 0.75);
      ctx.restore();
    }
    const nt = Math.max(1, Math.round(clamp(S.trucks, 0, 1) * trucks.length));
    for (let i = 0; i < nt; i++) truck(trucks[i].x * W, v.mid + lh * 0.3, lh * 0.55);

    // ---- 肝细胞 ----
    const nC = cols();
    for (let r = 0; r < 3; r++) for (let c = -1; c < nC; c++) drawCell(cellAt(r, c));

    // ---- 疤痕纤维 + 星状细胞 ----
    if (S.fibro > 0.02) {
      ctx.strokeStyle = C.scar; ctx.lineCap = "round";
      ctx.lineWidth = 2 + S.fibro * 5;
      for (let r = 0; r < 3; r++) for (let c = -1; c < nC; c++) {
        const a = cellAt(r, c);
        if (rnd(a.id + 400) < S.fibro) wavy(a.x + p * 0.52, a.y - p * 0.42, a.x + p * 0.52, a.y + p * 0.42, a.id);
        if (r < 2 && rnd(a.id + 500) < S.fibro) wavy(a.x - p * 0.3, a.y + p * 0.5, a.x + p * 0.55, a.y + p * 0.5, a.id + 1);
      }
      for (let i = 0; i < 4; i++) {
        const a = cellAt(i % 2, 1 + i * 2);
        star(a.x + p * 0.52, a.y + p * 0.5, p * 0.2, clamp(S.fibro * 1.6, 0, 1));
      }
    }

    // ---- 免疫细胞 ----
    if (S.inflame > 0.03) {
      const is = p * 0.14;
      for (const m of immunes) {
        const q = immunePos(m);
        ctx.save(); ctx.globalAlpha *= clamp(S.inflame * 1.5, 0, 1);
        ctx.beginPath(); ctx.arc(q.x, q.y, is, 0, 6.3); ctx.fillStyle = C.immune; ctx.fill(); outline(2); ctx.stroke();
        ctx.fillStyle = "#e7dcff"; ctx.beginPath(); ctx.arc(q.x + is * 0.4, q.y - is * 0.4, is * 0.25, 0, 6.3); ctx.fill();
        face(q.x, q.y + is * 0.05, is * 0.7, 0.1, false);
        outline(1.5); ctx.beginPath();
        ctx.moveTo(q.x - is * 0.45, q.y - is * 0.42); ctx.lineTo(q.x - is * 0.12, q.y - is * 0.28);
        ctx.moveTo(q.x + is * 0.45, q.y - is * 0.42); ctx.lineTo(q.x + is * 0.12, q.y - is * 0.28); ctx.stroke();
        ctx.restore();
      }
    }

    // ---- 瘦人小卡片：看着瘦，肚子里有油 ----
    if (S.lean > 0.02) drawLeanCard();

    // ---- 最后一幕的小爱心 ----
    if (S.heal > 0.02) {
      for (const h of hearts) {
        const x = h.x * W, y = ((h.y - time * 0.04) % 1 + 1) % 1 * H;
        ctx.save(); ctx.globalAlpha *= S.heal * 0.9;
        heart(x, y, Math.max(7, H * 0.02) * (1 + 0.1 * Math.sin(time * 3 + h.ph)), C.heartPink);
        ctx.restore();
      }
    }
  }

  function wavy(x1, y1, x2, y2, seed) {
    const n = 8, dx = x2 - x1, dy = y2 - y1, len = Math.hypot(dx, dy), nx = -dy / len, ny = dx / len;
    ctx.beginPath();
    for (let i = 0; i <= n; i++) {
      const t = i / n, w = Math.sin(t * Math.PI * 3 + seed) * 3;
      ctx[i ? "lineTo" : "moveTo"](x1 + dx * t + nx * w, y1 + dy * t + ny * w);
    }
    ctx.stroke();
  }

  function drawCell(a) {
    const { x, y, h, f, bal } = a;
    ctx.save(); ctx.translate(x, y); ctx.rotate(a.rot);
    rrect(-h, -h * 0.92, h * 2, h * 1.84, h * 0.45);
    // 肿胀的细胞发白，纤维化时其余细胞颜色变暗
    ctx.fillStyle = bal > 0.3 ? mix(C.cell, C.cellPale, bal * 0.8) : mix(C.cell, C.cellScar, S.fibro * 0.5 * (1 - S.heal)); ctx.fill(); outline(2); ctx.stroke();
    // 小油滴 → 大油滴
    const big = h * 0.72 * clamp((f - 0.3) / 0.7, 0, 1);
    const smallA = clamp(1 - (f - 0.45) / 0.3, 0, 1);
    if (f > 0.03 && smallA > 0) {
      ctx.save(); ctx.globalAlpha *= smallA;
      const n = Math.min(6, Math.ceil(f * 12));
      for (let k = 0; k < n; k++) {
        const ax = (rnd(a.id * 7 + k) - 0.5) * h * 1.3, ay = (rnd(a.id * 9 + k) - 0.5) * h * 1.2;
        if (Math.hypot(ax, ay) < h * 0.4) continue;
        oil(ax, ay, h * (0.09 + 0.06 * rnd(a.id + k)));
      }
      ctx.restore();
    }
    if (big > 1) oil(h * 0.12, -h * 0.05, big);
    // 细胞核（小脸）：被大油滴挤到角落
    const push = big / (h * 0.72);
    const fx = -h * 0.45 * push, fy = h * 0.4 * push;
    const ns = h * 0.36 * (1 - 0.3 * push);
    ctx.beginPath(); ctx.ellipse(fx, fy, ns * (1 - 0.25 * push), ns, 0, 0, 6.3); ctx.fillStyle = C.nucleus; ctx.fill(); outline(1.5); ctx.stroke();
    const mood = clamp(1 - f * 0.9 - bal * 1.3 - S.fibro * 0.7 + S.heal * 0.9, -1, 1);
    face(fx, fy + ns * 0.05, ns * 0.9, mood, true);
    if (mood < -0.3) sweat(fx + ns * 0.9, fy - ns * 1.1, ns * 0.6);
    ctx.restore();
  }

  function immunePos(m) {
    const a = cellAt(1 + (m.k % 2), 1 + m.k * 2);
    const r = a.h * 1.08, t = time * 0.6 + m.ph;
    return { x: a.x + Math.cos(t) * r, y: a.y + Math.sin(t) * r * 0.85 };
  }

  function leanCard() {
    const cw = H * 0.24, ch = H * 0.36;
    return { x: W - cw - 14, y: H - ch - 14, cw, ch };
  }
  function drawLeanCard() {
    const k = leanCard(), a = S.lean;
    ctx.save(); ctx.globalAlpha *= a;
    ctx.fillStyle = C.ink; rrect(k.x + 5, k.y + 5, k.cw, k.ch, 18); ctx.fill();
    ctx.fillStyle = C.paper; rrect(k.x, k.y, k.cw, k.ch, 18); ctx.fill(); outline(2.5); ctx.stroke();
    const cx = k.x + k.cw / 2, top = k.y + k.ch * 0.1, u = k.ch;
    // 细细的小人
    outline(3.5);
    ctx.beginPath();
    ctx.moveTo(cx - u * 0.05, top + u * 0.5); ctx.lineTo(cx - u * 0.07, top + u * 0.68);
    ctx.moveTo(cx + u * 0.05, top + u * 0.5); ctx.lineTo(cx + u * 0.07, top + u * 0.68);
    ctx.moveTo(cx - u * 0.08, top + u * 0.24); ctx.lineTo(cx - u * 0.17, top + u * 0.4);
    ctx.moveTo(cx + u * 0.08, top + u * 0.24); ctx.lineTo(cx + u * 0.17, top + u * 0.4);
    ctx.stroke();
    rrect(cx - u * 0.09, top + u * 0.18, u * 0.18, u * 0.34, u * 0.08); ctx.fillStyle = "#9fd8ff"; ctx.fill(); outline(2); ctx.stroke();
    // 肚子里的脂肪 + 肝
    oil(cx - u * 0.02, top + u * 0.4, u * 0.045 * (0.6 + 0.4 * Math.sin(time * 2) ** 2));
    ctx.beginPath(); ctx.ellipse(cx + u * 0.035, top + u * 0.29, u * 0.04, u * 0.028, 0, 0, 6.3); ctx.fillStyle = "#f59a7c"; ctx.fill(); outline(1.2); ctx.stroke();
    ctx.beginPath(); ctx.arc(cx, top + u * 0.1, u * 0.075, 0, 6.3); ctx.fillStyle = "#ffe0cc"; ctx.fill(); outline(2); ctx.stroke();
    face(cx, top + u * 0.11, u * 0.06, 0.6);
    const fs = Math.min(Math.max(11, W / 70) * Anima.UI, k.cw / 9.5);
    ctx.fillStyle = C.ink; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.font = `${fs}px ${Anima.ROUND}`; ctx.fillText("BMI 21 · 体重正常", cx, k.y + k.ch - fs * 0.9);
    ctx.textAlign = "left";
    ctx.restore();
    return { bx: cx - u * 0.02, by: top + u * 0.4 };
  }

  function hud() {
    const fatPct = 1 + S.fat * 29;
    pill(14, 12, "肝脏脂肪", `${fatPct.toFixed(0)}%`, fatPct < 5 ? C.mint : fatPct < 15 ? "#e7a500" : "#f25f6b", false);
    const kpa = 4.5 + S.fibro * 13 + S.inflame * 1.5;
    pill(W - 14, 12, "肝脏硬度", `${kpa.toFixed(1)} kPa`, kpa < 7 ? C.mint : kpa < 12.5 ? "#e7a500" : "#f25f6b", true);
  }

  function draw() {
    scene();
    const v = V(), p = P();
    const L = CH[cur].labels, on = (k) => L.includes(k);
    const c0 = cellAt(0, 2);
    callout("cell", on("cell"), c0.x, c0.y, c0.x + W * 0.14, H * 0.5, "肝细胞：身体的化工厂");
    const nt = Math.max(1, Math.round(clamp(S.trucks, 0, 1) * trucks.length));
    const tk = trucks.slice(0, nt).find((t) => t.x > 0.2 && t.x < 0.75);
    const tx = tk ? tk.x * W : 0, ty = v.mid + v.h * 0.3;
    callout("truck", on("truck") && !!tk, tx, ty, tx + W * 0.1, gridTop() + p * 0.3, "运脂肪出肝的小货车");
    callout("fewtruck", on("fewtruck") && !!tk, tx, ty, tx - W * 0.05, gridTop() + p * 0.3, "蛋白质不够，小货车变少");
    const sd = sodas.find((s) => s.x > 0.1 && s.x < 0.6);
    callout("soda", on("soda") && !!sd && S.sugar > 0.6, sd ? sd.x * W : 0, v.mid, sd ? sd.x * W + W * 0.06 : 0, gridTop() + p * 0.25, "甜饮料里的果糖");
    const nf = Math.round(clamp(S.sugar, 0, 1) * fats.length);
    const fd = fats.slice(0, nf).find((f) => f.x > 0.62 && f.x < 0.85);
    callout("bellyfat", on("bellyfat") && !!fd, fd ? fd.x * W : 0, fd ? v.mid + fd.yn * v.h * 0.68 : 0, fd ? fd.x * W - W * 0.02 : 0, gridTop() + p * 1.2, "肚子里的脂肪流进来");
    const cd = cellAt(2, 2);
    callout("droplet", on("droplet"), cd.x + cd.h * 0.5, cd.y - cd.h * 0.4, cd.x + W * 0.2, H * 0.97, "肝细胞里的小油滴");
    if (S.lean > 0.02) {
      const k = leanCard();
      const u = k.ch, bx = k.x + k.cw / 2 - u * 0.02, by = k.y + k.ch * 0.1 + u * 0.4;
      callout("lean", on("lean"), bx, by, k.x - W * 0.13, k.y + k.ch * 0.45, "看着瘦，肚子里藏着油");
    } else callout("lean", false, 0, 0, 0, 0, "");
    const cb = cellAt(1, 3);
    callout("big", on("big"), cb.x + cb.h * 0.2, cb.y - cb.h * 0.1, cb.x + W * 0.16, gridTop() + p * 0.25, "大油滴把细胞核挤到角落");
    let bc = null;
    for (let c = 2; c < cols() && !bc; c++) { const a = cellAt(1, c); if (a.ballooned && a.x > W * 0.3) bc = a; }
    callout("balloon", on("balloon") && !!bc, bc ? bc.x : 0, bc ? bc.y + bc.h * 0.6 : 0, bc ? bc.x + W * 0.12 : 0, H * 0.97, "肝细胞肿胀、受伤");
    const im = immunePos(immunes[2]);
    callout("immune", on("immune"), im.x, im.y, im.x - W * 0.12, gridTop() + p * 0.2, "免疫细胞引起炎症");
    const sc = cellAt(1, 2);
    callout("scar", on("scar"), sc.x + p * 0.52, sc.y, sc.x + W * 0.16, H * 0.97, "疤痕纤维：肝脏变硬");
    const st = cellAt(1, 3);
    callout("stellate", on("stellate"), st.x + p * 0.52, st.y + p * 0.5, st.x + W * 0.06, gridTop() + p * 0.2, "星状细胞在“补墙”");
    const sh = cellAt(1, 3);
    callout("shrink", on("shrink"), sh.x, sh.y, sh.x + W * 0.16, gridTop() + p * 0.25, "油滴变小，细胞又笑了");
    hud();
  }

  Anima.start({
    chapters: CH, state: S, dur: DUR, accent: "#f0945a",
    titleCard: { lines: ["瘦人也会得", "脂肪肝？"], sub: "肝脏小剧场 · 7 幕" },
    sync(e) { W = e.W; H = e.H; time = e.time; cur = e.cur; },
    update, draw,
  });
})();
</script>
