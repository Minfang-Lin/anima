<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>糖与血管</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
/* 绘本风：只有一套浅色配色，所有颜色都显式指定 */
:root {
  color-scheme: light;
  --ground: #fff1ee;
  --paper: #ffffff;
  --ink: #5b3a4a;
  --soft: #9a7885;
  --coral: #ff7b7b;
  --sugar: #ffc94d;
  --mint: #6cc9ae;
  --blush: #ffd3d0;
  --round: "ZCOOL KuaiLe", "Yuanti SC", "YouYuan", "PingFang SC", sans-serif;
  --sans: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--ground);
  background-image: radial-gradient(#ffdcd6 1.6px, transparent 1.6px);
  background-size: 22px 22px;
  color: var(--ink);
  font: 15px/1.8 var(--sans);
  padding-inline: 16px;
  padding-block: 28px 48px;
}
.wrap { max-width: 1080px; margin: 0 auto; display: grid; gap: 22px; }
header { display: grid; gap: 8px; }
.tag {
  justify-self: start; font: 16px/1 var(--round); color: var(--paper); background: var(--mint);
  padding: 6px 14px; border-radius: 999px; border: 2.5px solid var(--ink);
}
h1 { font: 400 clamp(30px, 5.4vw, 50px)/1.2 var(--round); margin: 0; text-wrap: balance; letter-spacing: .02em; }
h1 em { font-style: normal; color: var(--coral); }
.lede { margin: 0; color: var(--soft); max-width: 62ch; }

.stage {
  position: relative; border-radius: 26px; overflow: hidden;
  background: #ffe7e3; border: 3px solid var(--ink); box-shadow: 6px 6px 0 var(--ink);
}
canvas { display: block; width: 100%; height: auto; aspect-ratio: 16 / 9; max-width: 100%; }
.bar { height: 8px; background: #ffd9d3; border-top: 3px solid var(--ink); }
.bar i { display: block; height: 100%; width: 0; background: var(--mint); }

.below { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr); gap: 22px; align-items: start; }
@media (max-width: 760px) { .below { grid-template-columns: 1fr; } }

ol.chapters { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
ol.chapters button {
  width: 100%; text-align: left; display: flex; gap: 10px; align-items: center;
  background: transparent; color: var(--soft); border: 2.5px solid transparent; border-radius: 16px;
  padding: 6px 10px; font: 17px/1.3 var(--round); cursor: pointer;
}
ol.chapters button span {
  flex: none; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center;
  background: var(--blush); color: var(--ink); font: 15px/1 var(--round);
}
ol.chapters button:hover { color: var(--ink); background: var(--paper); }
ol.chapters button[aria-current="step"] { background: var(--paper); color: var(--ink); border-color: var(--ink); }
ol.chapters button[aria-current="step"] span { background: var(--coral); color: var(--paper); }
button:focus-visible { outline: 3px solid var(--mint); outline-offset: 2px; }

.narr {
  display: grid; gap: 12px; background: var(--paper); border-radius: 22px;
  border: 3px solid var(--ink); box-shadow: 5px 5px 0 var(--ink); padding: 18px 22px;
}
.narr h2 { margin: 0; font: 400 26px/1.3 var(--round); }
.narr p { margin: 0; max-width: 62ch; }
.fact {
  font-size: 14px; line-height: 1.6; background: #fff6da; border-radius: 14px;
  padding: 8px 12px; border: 2px dashed var(--sugar);
}
.controls { display: flex; gap: 10px; flex-wrap: wrap; }
.controls button {
  background: var(--paper); color: var(--ink); border: 2.5px solid var(--ink); border-radius: 999px;
  padding: 5px 16px; font: 17px var(--round); cursor: pointer; box-shadow: 3px 3px 0 var(--ink);
}
.controls button:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }
.controls button.primary { background: var(--coral); color: var(--paper); }
footer { color: var(--soft); font-size: 13px; }
@media (prefers-reduced-motion: reduce) { .controls button:active { transform: none; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="tag">血管小剧场 · 7 幕</span>
    <h1>多余的<em>糖</em>，如何一步步伤害血管</h1>
    <p class="lede">跟着血管里的红细胞小伙伴走一趟：看看血糖升高后，血管里发生了什么，以及我们可以怎样帮它们。</p>
  </header>

  <div class="stage">
    <canvas id="cv" aria-label="卡通血管纵切面动画"></canvas>
    <div class="bar"><i id="prog"></i></div>
  </div>

  <div class="below">
    <ol class="chapters" id="chapters"></ol>
    <section class="narr" aria-live="polite">
      <h2 id="nTitle"></h2>
      <p id="nText"></p>
      <div class="fact" id="nFact"></div>
      <div class="controls">
        <button id="prev" type="button">上一幕</button>
        <button id="play" type="button" class="primary">暂停</button>
        <button id="next" type="button">下一幕</button>
      </div>
    </section>
  </div>

  <footer>科普示意动画，比例和形象都经过卡通化处理，不能替代医生的诊断和建议。</footer>
</div>

<script id="video-meta" type="application/json">
{
  "intro": "多余的糖，是怎样一步步伤害血管的？跟着红细胞小伙伴，一起去血管里看看吧。",
  "spoken": { "AGEs": "A G E S", "HbA1c": "糖化血红蛋白" },
  "sad": [2, 3, 4, 5]
}
</script>
<script>
// 科普动画共用引擎：绘本风画笔、章节切换、网页播放和逐帧录制。
// 每个主题页面只需要提供章节数据、状态、update() 和 draw()，然后调用 Anima.start(...)。
(() => {
  // 共用配色（主题可以往里加自己的颜色）
  const C = {
    ink: "#5b3a4a", paper: "#ffffff", soft: "#9a7885", mint: "#6cc9ae", coral: "#ff7b7b",
    sugar: "#ffc94d", blush: "#ff9fb0", ros: "#8b7cf6", tissue: "#ffe7e3", dot: "#ffd6cf",
  };
  const ROUND = '"ZCOOL KuaiLe", "Yuanti SC", "YouYuan", "PingFang SC", sans-serif';
  const SANS = '"Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif';

  const cv = document.getElementById("cv");
  const ctx = cv.getContext("2d");
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

  // 录制模式（record.js 注入 window.__RECORD / __RATIO / __TIMELINE）：固定尺寸画布，逐帧手动推进
  const REC = window.__RECORD === true;
  const LAYOUTS = {
    // VW×VH 视频尺寸；舞台左上角 (SX, SY)、大小 SW×SH；K 为舞台缩放；UI 为标注字号倍数
    "16:9": { VW: 1920, VH: 1080, SX: 240, SY: 36, SW: 1440, SH: 810, K: 1, UI: 1 },
    "3:4": { VW: 1080, VH: 1440, SX: 40, SY: 150, SW: 1000, SH: 820, K: 1.3, UI: 1.7 },
  };
  const LY = LAYOUTS[window.__RATIO] || LAYOUTS["16:9"];
  const { VW, VH, SX, SY } = LY;
  const UI = REC ? LY.UI : 1;

  let W = 0, H = 0, time = 0, cur = 0;
  const labelAlpha = {};

  // ---------- 小工具 ----------
  const rnd = (i) => { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
  const lerp = (a, b, t) => a + (b - a) * t;
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const mix = (h1, h2, t) => {
    const a = parseInt(h1.slice(1), 16), b = parseInt(h2.slice(1), 16);
    const c = (s) => Math.round(lerp((a >> s) & 255, (b >> s) & 255, clamp(t, 0, 1)));
    return `rgb(${c(16)},${c(8)},${c(0)})`;
  };

  // ---------- 绘本风画笔 ----------
  function outline(w = 2.5) { ctx.strokeStyle = C.ink; ctx.lineWidth = w; ctx.lineJoin = "round"; ctx.lineCap = "round"; }
  function rrect(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
  // mood: 1 开心，0 平静，-1 难过
  function face(x, y, s, mood, blush = true) {
    ctx.fillStyle = C.ink;
    const blink = (Math.sin(time * 1.3 + x * 0.05) > 0.985) ? 0.25 : 1;
    ctx.beginPath(); ctx.ellipse(x - s * 0.32, y - s * 0.08, s * 0.1, s * 0.13 * blink, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(x + s * 0.32, y - s * 0.08, s * 0.1, s * 0.13 * blink, 0, 0, Math.PI * 2); ctx.fill();
    if (blush) {
      ctx.fillStyle = "rgba(255,159,176,0.8)";
      ctx.beginPath(); ctx.ellipse(x - s * 0.55, y + s * 0.18, s * 0.14, s * 0.08, 0, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(x + s * 0.55, y + s * 0.18, s * 0.14, s * 0.08, 0, 0, Math.PI * 2); ctx.fill();
    }
    outline(Math.max(1.2, s * 0.09));
    ctx.beginPath();
    ctx.moveTo(x - s * 0.2, y + s * 0.2);
    ctx.quadraticCurveTo(x, y + s * 0.2 + s * 0.28 * mood, x + s * 0.2, y + s * 0.2);
    ctx.stroke();
  }
  // 汗珠，(x, y) 是水滴顶端
  function sweat(x, y, s) {
    ctx.fillStyle = "#9fd8ff";
    ctx.beginPath(); ctx.moveTo(x, y); ctx.quadraticCurveTo(x + s * 0.6, y + s * 0.9, x, y + s);
    ctx.quadraticCurveTo(x - s * 0.5, y + s * 0.7, x, y); ctx.fill(); outline(1.2); ctx.stroke();
  }
  function heart(x, y, s, color) {
    ctx.beginPath();
    ctx.moveTo(x, y + s * 0.7);
    ctx.bezierCurveTo(x - s * 1.2, y - s * 0.1, x - s * 0.5, y - s * 0.9, x, y - s * 0.3);
    ctx.bezierCurveTo(x + s * 0.5, y - s * 0.9, x + s * 1.2, y - s * 0.1, x, y + s * 0.7);
    ctx.fillStyle = color; ctx.fill(); outline(1.8); ctx.stroke();
  }
  function bolt(x, y, s, a, color = C.ros) {
    ctx.save(); ctx.globalAlpha *= a; ctx.translate(x, y);
    ctx.beginPath();
    ctx.moveTo(-s * 0.2, -s); ctx.lineTo(s * 0.45, -s * 0.15); ctx.lineTo(0, -s * 0.05);
    ctx.lineTo(s * 0.25, s); ctx.lineTo(-s * 0.45, s * 0.05); ctx.lineTo(0, -s * 0.02); ctx.closePath();
    ctx.fillStyle = color; ctx.fill(); outline(1.6); ctx.stroke();
    ctx.restore();
  }
  // 圆点背景
  function dots(n, color, seed = 30) {
    ctx.fillStyle = color;
    for (let i = 0; i < n; i++) { ctx.beginPath(); ctx.arc(rnd(i + seed) * W, rnd(i + seed + 30) * H, 3 + rnd(i) * 4, 0, Math.PI * 2); ctx.fill(); }
  }

  // 对话框标注：key 用来记住淡入淡出，(tx, ty) 指向的点，(lx, ly) 气泡位置
  function callout(key, on, tx, ty, lx, ly, text) {
    const a = labelAlpha[key] = lerp(labelAlpha[key] || 0, on ? 1 : 0, 0.08);
    if (a < 0.02) return;
    ctx.save();
    ctx.globalAlpha *= a;
    const fs = Math.max(12, W / 56) * UI;
    ctx.font = `${fs}px ${ROUND}`;
    const w = ctx.measureText(text).width + 22, bh = fs + 14;
    const bx = clamp(lx - w / 2, 6, W - w - 6), by = clamp(ly < ty ? ly - bh : ly, 6, H - bh - 6);
    outline(2);
    ctx.setLineDash([4, 4]);
    ctx.beginPath(); ctx.moveTo(tx, ty); ctx.lineTo(clamp(lx, bx + 12, bx + w - 12), ly < ty ? by + bh : by); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = C.paper;
    ctx.beginPath(); ctx.arc(tx, ty, 4, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    rrect(bx, by, w, bh, bh / 2); ctx.fill(); outline(2.5); ctx.stroke();
    ctx.fillStyle = C.ink; ctx.textBaseline = "middle";
    ctx.fillText(text, bx + 11, by + bh / 2 + 1);
    ctx.restore();
  }

  // 角落里的数值胶囊
  function pill(x, y, label, value, color, alignRight) {
    const fs = Math.max(12, W / 60) * UI;
    ctx.font = `${fs}px ${ROUND}`;
    const t1 = ctx.measureText(label).width;
    ctx.font = `${fs * 1.4}px ${ROUND}`;
    const t2 = ctx.measureText(value).width;
    const w = t1 + t2 + 34, h = fs * 1.4 + 14;
    const bx = alignRight ? x - w : x;
    rrect(bx, y, w, h, h / 2); ctx.fillStyle = C.paper; ctx.fill(); outline(2.5); ctx.stroke();
    ctx.textBaseline = "middle";
    ctx.font = `${fs}px ${ROUND}`; ctx.fillStyle = C.soft; ctx.fillText(label, bx + 14, y + h / 2 + 1);
    ctx.font = `${fs * 1.4}px ${ROUND}`; ctx.fillStyle = color; ctx.fillText(value, bx + 20 + t1, y + h / 2 + 1);
  }

  function wrapText(text, maxW) {
    const lines = []; let line = "";
    for (const ch of text) {
      // 标点不放在行首
      if (ctx.measureText(line + ch).width > maxW && line && !"，。、；：！？）》”".includes(ch)) { lines.push(line); line = ch; } else line += ch;
    }
    if (line) lines.push(line);
    return lines;
  }

  // ---------- 启动 ----------
  function start(cfg) {
    const CH = cfg.chapters, S = cfg.state, DUR = cfg.dur || 11;
    const accent = cfg.accent || C.coral;
    let chT = 0, playing = !reduce;
    const sync = () => cfg.sync({ W, H, time, cur });

    function resize() {
      if (REC) { W = LY.SW / LY.K; H = LY.SH / LY.K; cv.width = VW; cv.height = VH; }
      else {
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        W = cv.clientWidth; H = W * 9 / 16;
        cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }
      sync();
    }
    addEventListener("resize", resize); resize();

    function update(dt) {
      const tgt = CH[cur];
      const k = 1 - Math.exp(-dt * 1.4);
      for (const key of Object.keys(S)) if (key in tgt) S[key] = lerp(S[key], tgt[key], k);
      sync();
      cfg.update(dt);
    }
    function draw() { ctx.globalAlpha = 1; sync(); cfg.draw(); }

    // 界面
    const list = document.getElementById("chapters");
    CH.forEach((c, i) => {
      const li = document.createElement("li");
      const b = document.createElement("button");
      b.type = "button"; b.id = "ch" + i;
      b.innerHTML = `<span>${i + 1}</span>${c.title}`;
      b.addEventListener("click", () => go(i));
      li.appendChild(b); list.appendChild(li);
    });
    const playBtn = document.getElementById("play");
    function go(i) {
      cur = (i + CH.length) % CH.length; chT = 0;
      const c = CH[cur];
      document.getElementById("nTitle").textContent = c.title;
      document.getElementById("nText").textContent = c.text;
      document.getElementById("nFact").textContent = c.fact;
      list.querySelectorAll("button").forEach((b, j) => { if (j === cur) b.setAttribute("aria-current", "step"); else b.removeAttribute("aria-current"); });
      sync();
    }
    document.getElementById("prev").onclick = () => go(cur - 1);
    document.getElementById("next").onclick = () => go(cur + 1);
    playBtn.onclick = () => { playing = !playing; playBtn.textContent = playing ? "暂停" : "播放"; };
    playBtn.textContent = playing ? "暂停" : "播放";
    addEventListener("keydown", (e) => {
      if (e.key === "ArrowRight") go(cur + 1);
      if (e.key === "ArrowLeft") go(cur - 1);
      if (e.key === " " && e.target === document.body) { e.preventDefault(); playBtn.click(); }
    });
    go(0);

    // 录制画面：舞台 + 片头 + 字幕卡
    function renderVideo() {
      const SW = LY.SW, SH = LY.SH, portrait = VH > VW, c = CH[cur];
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.fillStyle = "#fff1ee"; ctx.fillRect(0, 0, VW, VH);
      ctx.fillStyle = "#ffdcd6";
      for (let y = 11; y < VH; y += 22) for (let x = 11; x < VW; x += 22) { ctx.beginPath(); ctx.arc(x, y, 1.6, 0, Math.PI * 2); ctx.fill(); }
      ctx.fillStyle = C.ink; rrect(SX + 8, SY + 8, SW, SH, 36); ctx.fill();
      ctx.save(); ctx.translate(SX, SY); rrect(0, 0, SW, SH, 36); ctx.clip(); ctx.scale(LY.K, LY.K);
      draw();
      const titleT = window.__TIMELINE ? window.__TIMELINE.intro : 2.5;
      const ta = time < titleT ? 1 : clamp(1 - (time - titleT), 0, 1);
      if (ta > 0) {
        ctx.globalAlpha = ta;
        ctx.fillStyle = "rgba(255,241,238,0.92)"; ctx.fillRect(0, 0, W, H);
        ctx.fillStyle = C.ink; ctx.textAlign = "center"; ctx.textBaseline = "middle";
        const lines = portrait ? cfg.titleCard.lines : [cfg.titleCard.lines.join("")];
        const fs = portrait ? 62 : 72;
        ctx.font = `${fs}px ${ROUND}`;
        lines.forEach((ln, i) => ctx.fillText(ln, W / 2, H / 2 - 30 - (lines.length - 1 - i) * fs * 1.25));
        ctx.font = `${fs * 0.47}px ${ROUND}`; ctx.fillStyle = C.soft; ctx.fillText(cfg.titleCard.sub, W / 2, H / 2 + 50);
        ctx.textAlign = "left"; ctx.globalAlpha = 1;
      }
      ctx.restore();
      outline(4); rrect(SX, SY, SW, SH, 36); ctx.stroke();

      ctx.textBaseline = "middle";
      const badgeAt = (x, y, fs) => {
        ctx.font = `${fs}px ${ROUND}`;
        const badge = `第 ${cur + 1} 幕`, bw = ctx.measureText(badge).width + fs * 1.1, bh = fs * 1.6;
        rrect(x, y - bh / 2, bw, bh, bh / 2); ctx.fillStyle = accent; ctx.fill(); outline(3); ctx.stroke();
        ctx.fillStyle = C.paper; ctx.fillText(badge, x + fs * 0.55, y + 1);
        return bw;
      };
      if (!portrait) {
        const cy0 = SY + SH + 26, ch = VH - cy0 - 22;
        ctx.fillStyle = C.ink; rrect(SX + 6, cy0 + 6, SW, ch, 28); ctx.fill();
        ctx.fillStyle = C.paper; rrect(SX, cy0, SW, ch, 28); ctx.fill(); outline(4); ctx.stroke();
        const bw = badgeAt(SX + 26, cy0 + 43, 28);
        ctx.fillStyle = C.ink; ctx.font = `36px ${ROUND}`; ctx.fillText(c.title, SX + 46 + bw, cy0 + 43);
        ctx.font = `24px ${SANS}`;
        wrapText(c.text, SW - 56).slice(0, 3).forEach((ln, i) => ctx.fillText(ln, SX + 28, cy0 + 90 + i * 34));
        return;
      }
      const bw = badgeAt(SX, 78, 34);
      ctx.fillStyle = C.ink; ctx.font = `50px ${ROUND}`;
      ctx.fillText(c.title, SX + bw + 20, 80);
      const cy0 = SY + SH + 34, ch = VH - cy0 - 40;
      ctx.fillStyle = C.ink; rrect(SX + 8, cy0 + 8, SW, ch, 32); ctx.fill();
      ctx.fillStyle = C.paper; rrect(SX, cy0, SW, ch, 32); ctx.fill(); outline(4); ctx.stroke();
      ctx.fillStyle = C.ink; ctx.font = `35px ${SANS}`;
      wrapText(c.text, SW - 70).slice(0, 5).forEach((ln, i) => ctx.fillText(ln, SX + 35, cy0 + 52 + i * 52));
      ctx.font = `26px ${SANS}`;
      const fy = cy0 + ch - 58;
      rrect(SX + 28, fy - 26, SW - 56, 52, 18); ctx.fillStyle = "#fff6da"; ctx.fill();
      ctx.strokeStyle = C.sugar; ctx.lineWidth = 2.5; ctx.setLineDash([8, 6]); ctx.stroke(); ctx.setLineDash([]);
      ctx.fillStyle = C.ink; ctx.fillText(wrapText(c.fact, SW - 90)[0], SX + 45, fy + 1);
    }

    const prog = document.getElementById("prog");
    if (REC) {
      // 由 record.js 调用：每次推进一帧并画出来；有配音时每幕时长跟着 __TIMELINE 走
      const TL = window.__TIMELINE;
      const durs = TL ? TL.durs : CH.map(() => DUR);
      window.__rec = {
        total: durs.reduce((a, b) => a + b, 0),
        tick(dt) {
          time += dt; chT += dt;
          if (chT > durs[cur] && cur < CH.length - 1) { const over = chT - durs[cur]; go(cur + 1); chT = over; }
          update(dt); renderVideo();
        },
      };
      return;
    }
    let last = performance.now();
    function frame(now) {
      const dt = Math.min(0.05, (now - last) / 1000); last = now;
      time += dt;
      if (playing) { chT += dt; if (chT > DUR) go(cur + 1); }
      prog.style.width = (chT / DUR * 100).toFixed(2) + "%";
      update(dt);
      draw();
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  }

  window.Anima = {
    ctx, C, ROUND, SANS, UI, rnd, lerp, clamp, mix,
    outline, rrect, face, sweat, heart, bolt, dots, callout, pill, start,
  };
})();
</script>
<script>
(() => {
  const CH = [
    { title: "健康的血管", glucose: 5.2, ages: 0, damage: 0, plaque: 0, micro: 0, heal: 0,

      fact: "正常空腹血糖 3.9–6.1 mmol/L",

    { title: "内皮受伤，发炎了", glucose: 13, ages: 1, damage: 1, plaque: 0.18, micro: 0, heal: 0,
      text: "AGEs 和高糖代谢会产生很多活性氧（小闪电）。内皮细胞被电得晕头转向，彼此之间出现缝隙，血管不再能好好放松。白细胞赶来帮忙，却黏在伤口上，钻进了管壁。",
      fact: "氧化应激 + 慢性炎症，是动脉粥样硬化的起点",
      labels: ["ros", "gap", "mono"] },
    { title: "斑块长大，路变窄了", glucose: 13, ages: 1, damage: 1, plaque: 1, micro: 0, heal: 0,
      text: "钻进管壁的白细胞吞下被氧化的坏胆固醇，变成胖胖的泡沫细胞，越堆越多，形成像奶油一样的脂质核心，外面盖着一层纤维帽。通道变窄，红细胞只能挤着过去。斑块一旦破裂，会形成血栓，引起心梗或中风。",
      fact: "糖尿病患者发生心血管疾病的风险约为非糖尿病人群的 2–4 倍",
      labels: ["core", "cap", "hud2"] },
    { title: "小血管也在受伤", glucose: 13, ages: 1, damage: 1, plaque: 1, micro: 1, heal: 0,
      text: "最细的毛细血管只容得下红细胞排队通过。高血糖让它的基底膜变厚，管壁开始渗漏。眼睛、肾脏和神经都靠这些小血管供养，所以会出现视网膜病变、糖尿病肾病和手脚麻木。",
      fact: "三大微血管并发症：眼（视网膜）· 肾（肾小球）· 神经（手脚麻木）",
      labels: ["bm", "leak", "single"] },
    { title: "照顾好血糖，血管会感谢你", glucose: 6.4, ages: 0.55, damage: 0.35, plaque: 0.75, micro: 0, heal: 1,
      text: "已经造成的损伤很难完全消失，但把血糖、血压、血脂控制在目标范围，再加上不吸烟、多运动，就能明显放慢新的损伤，让斑块更稳定。红细胞们又能笑着出发啦。",
      fact: "常见目标：HbA1c < 7%，血压 < 130/80 mmHg，定期查眼底和尿微量白蛋白",
      labels: ["hud", "heal"] },
  ];
  const DUR = 11; // 每幕秒数

  // 配色（在共用调色板上加本主题的颜色）
  const C = Object.assign(Anima.C, {
    tissue: "#ffe7e3", dot: "#ffd6cf", wall: "#ffb3b3", adv: "#ffcdc4",
    lumen: "#fff4ec", lumenSweet: "#fff0c2", endo: "#ffe0e6", endoHurt: "#d9c8cf",
    rbc: "#ff7b7b", rbcTired: "#e0897a", age: "#b07a4f",
    mono: "#ffffff", plaque: "#ffe29a", core: "#ffd166", bm: "#c9b6f2",
  });
  const { ctx, rnd, clamp, mix, outline, rrect, face, heart, bolt, callout, pill } = Anima;
  let W = 0, H = 0, time = 0, cur = 0;

  const S = { glucose: 5.2, ages: 0, damage: 0, plaque: 0, micro: 0, heal: 0 };
  // ---------- 几何 ----------
  const G = () => {
    const cy = H * 0.52, pulse = Math.sin(time * Math.PI * 2 * 1.0);
    const R = H * 0.25 * (1 + 0.035 * pulse * (1 - 0.85 * S.ages));
    const wallT = H * 0.15, px = W * 0.6, sig = W * 0.12;
    return { cy, R, wallT, px, sig, pulse };
  };
  const bump = (g, x) => Math.exp(-(((x - g.px) / g.sig) ** 2));
  const topE = (g, x) => g.cy - g.R + S.plaque * g.R * 0.16 * bump(g, x);
  const botE = (g, x) => g.cy + g.R - S.plaque * g.R * 0.62 * bump(g, x);
  const half = (g, x) => (botE(g, x) - topE(g, x)) / 2;
  const mid = (g, x) => (botE(g, x) + topE(g, x)) / 2;

  // ---------- 粒子 ----------
  const rbcs = Array.from({ length: 24 }, (_, i) => ({ x: rnd(i) * 1.2, yn: rnd(i + 50) * 1.5 - 0.75, ph: rnd(i + 90) * 6 }));
  const glus = Array.from({ length: 110 }, (_, i) => ({ x: rnd(i + 200), yn: rnd(i + 400) * 1.8 - 0.9, ph: rnd(i + 600) * 6, rot: rnd(i + 700) * 6 }));
  const monos = Array.from({ length: 4 }, (_, i) => ({ x: rnd(i + 900) * 0.4, st: 0, d: 0, k: i }));
  const sparks = [];
  const capR = Array.from({ length: 8 }, (_, i) => ({ x: i / 8 }));
  const leaks = [];
  const hearts = Array.from({ length: 9 }, (_, i) => ({ x: rnd(i + 8000), y: rnd(i + 8100), ph: rnd(i + 8200) * 6 }));

  function update(dt) {
    const g = G();
    const beat = 1 + 0.3 * Math.max(0, g.pulse);
    const base = 0.09 * beat * (1 - 0.25 * S.ages);

    for (const p of rbcs) {
      const h = Math.max(half(g, p.x * W), 4);
      p.x += base * dt * clamp(g.R / h, 0.6, 2.4) * (0.8 + 0.4 * (1 - Math.abs(p.yn)));
      if (p.x > 1.1) p.x -= 1.2;
    }
    for (const p of glus) {
      const h = Math.max(half(g, p.x * W), 4);
      p.x += base * 0.9 * dt * clamp(g.R / h, 0.6, 2.4);
      p.rot += dt * 0.8;
      if (p.x > 1.05) p.x -= 1.1;
    }
    for (const m of monos) {
      if (m.st === 0) {
        m.x += base * 0.55 * dt;
        if (S.damage > 0.5 && Math.abs(m.x * W - g.px) < g.sig * 0.5) m.st = 1;
        if (m.x > 1.1) m.x = -0.1 - rnd(m.k + time) * 0.3;
      } else {
        m.d += dt * 0.35;
        if (m.d > 1.6 || S.damage < 0.3) { m.st = 0; m.d = 0; m.x = -0.1 - rnd(m.k * 3 + time) * 0.4; }
      }
    }
    if (Math.random() < S.damage * dt * 7 && S.micro < 0.5) {
      sparks.push({ x: Math.random() * W, top: Math.random() < 0.5, life: 0.7, off: Math.random() * 14 });
    }
    for (let i = sparks.length - 1; i >= 0; i--) { sparks[i].life -= dt; if (sparks[i].life <= 0) sparks.splice(i, 1); }
    for (const c of capR) { c.x += dt * 0.06 * (1 - 0.3 * S.ages); if (c.x > 1.06) c.x -= 1.12; }
    if (S.micro > 0.5 && Math.random() < dt * 6 * S.ages) {
      leaks.push({ x: Math.random() * W, dir: Math.random() < 0.5 ? -1 : 1, d: 0, life: 2.4 });
    }
    for (let i = leaks.length - 1; i >= 0; i--) { const l = leaks[i]; l.d += dt * 18; l.life -= dt; if (l.life <= 0) leaks.splice(i, 1); }
  }

  // ---------- 小画笔 ----------
  function sugarCube(x, y, s, rot) {
    ctx.save(); ctx.translate(x, y); ctx.rotate(Math.sin(rot) * 0.4);
    rrect(-s, -s, s * 2, s * 2, s * 0.5);
    ctx.fillStyle = C.sugar; ctx.fill(); outline(1.6); ctx.stroke();
    ctx.fillStyle = "rgba(255,255,255,0.8)";
    ctx.beginPath(); ctx.arc(-s * 0.35, -s * 0.35, s * 0.28, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }
  const rbcMood = () => clamp(1 - 1.5 * S.damage - 0.3 * S.ages + 0.6 * S.heal, -1, 1);

  // ---------- 大血管 ----------
  function drawMacro() {
    const g = G();
    const step = Math.max(4, W / 160);
    // 组织背景 + 圆点
    ctx.fillStyle = C.tissue; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = C.dot;
    for (let i = 0; i < 30; i++) { ctx.beginPath(); ctx.arc(rnd(i + 30) * W, rnd(i + 60) * H, 3 + rnd(i) * 4, 0, Math.PI * 2); ctx.fill(); }

    // 管壁
    const wallTop = g.cy - g.R - g.wallT, wallBot = g.cy + g.R + g.wallT;
    ctx.fillStyle = C.adv;
    rrect(-10, wallTop, W + 20, wallBot - wallTop, 0); ctx.fill();
    ctx.fillStyle = C.wall;
    ctx.fillRect(0, wallTop + g.wallT * 0.3, W, wallBot - wallTop - g.wallT * 0.6);
    outline(3);
    ctx.beginPath(); ctx.moveTo(0, wallTop); ctx.lineTo(W, wallTop); ctx.moveTo(0, wallBot); ctx.lineTo(W, wallBot); ctx.stroke();

    // 胶原纤维（白色波浪）+ AGE 交联
    for (const side of [-1, 1]) {
      for (let f = 0; f < 2; f++) {
        const y0 = g.cy + side * (g.R + g.wallT * (0.3 + f * 0.25));
        ctx.strokeStyle = "rgba(255,255,255,0.85)"; ctx.lineWidth = 2.2; ctx.lineCap = "round";
        ctx.beginPath();
        for (let x = 0; x <= W; x += step) {
          const y = y0 + Math.sin(x * 0.04 + f * 2 + side + time * 0.6 * (1 - S.ages)) * 3.5 * (1 - 0.7 * S.ages);
          ctx[x ? "lineTo" : "moveTo"](x, y);
        }
        ctx.stroke();
      }
      if (S.ages > 0.05) {
        for (let i = 0; i < 26; i++) {
          if (rnd(i + (side > 0 ? 3000 : 3100)) > S.ages) continue;
          const x = (i + 0.5) / 26 * W;
          const y1 = g.cy + side * (g.R + g.wallT * 0.3), y2 = g.cy + side * (g.R + g.wallT * 0.55);
          ctx.fillStyle = C.age; outline(1.5);
          ctx.beginPath(); ctx.arc(x, (y1 + y2) / 2, 3.2 * S.ages, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
          ctx.strokeStyle = C.age; ctx.lineWidth = 2.5;
          ctx.beginPath(); ctx.moveTo(x, y1); ctx.lineTo(x, y2); ctx.stroke();
        }
      }
    }

    // 管腔
    ctx.fillStyle = mix(C.lumen, C.lumenSweet, (S.glucose - 5) / 8);
    ctx.beginPath();
    for (let x = -step; x <= W + step; x += step) ctx.lineTo(x, topE(g, x));
    for (let x = W + step; x >= -step; x -= step) ctx.lineTo(x, botE(g, x));
    ctx.closePath(); ctx.fill();

    // 斑块
    if (S.plaque > 0.02) {
      const baseY = g.cy + g.R + 4;
      ctx.beginPath();
      for (let x = g.px - g.sig * 2.2; x <= g.px + g.sig * 2.2; x += step) ctx.lineTo(x, botE(g, x));
      ctx.lineTo(g.px + g.sig * 2.2, baseY); ctx.lineTo(g.px - g.sig * 2.2, baseY); ctx.closePath();
      ctx.fillStyle = C.plaque; ctx.fill();
      const coreH = S.plaque * g.R * 0.4;
      ctx.fillStyle = C.core;
      ctx.beginPath();
      ctx.ellipse(g.px, g.cy + g.R - coreH * 0.55, g.sig * 0.72 * S.plaque + 2, coreH * 0.55 + 1, 0, 0, Math.PI * 2);
      ctx.fill(); outline(2); ctx.setLineDash([5, 5]); ctx.stroke(); ctx.setLineDash([]);
      // 胖胖的泡沫细胞
      for (let i = 0; i < 5; i++) {
        if (rnd(i + 5000) * 0.9 > S.plaque) continue;
        const fx = g.px + (i - 2) * g.sig * 0.26 * S.plaque, fy = g.cy + g.R - coreH * (0.45 + 0.25 * (i % 2));
        const fs = Math.max(5, H * 0.018) * S.plaque;
        ctx.fillStyle = "#fff8e1"; ctx.beginPath(); ctx.arc(fx, fy, fs, 0, Math.PI * 2); ctx.fill(); outline(1.5); ctx.stroke();
        face(fx, fy, fs * 0.9, -0.2, false);
      }
      // 纤维帽
      outline(3.5);
      ctx.beginPath();
      for (let x = g.px - g.sig * 1.8; x <= g.px + g.sig * 1.8; x += step) ctx.lineTo(x, botE(g, x));
      ctx.stroke();
      ctx.strokeStyle = "#fffaf0"; ctx.lineWidth = 2;
      ctx.beginPath();
      for (let x = g.px - g.sig * 1.5; x <= g.px + g.sig * 1.5; x += step) ctx.lineTo(x, botE(g, x) + 3);
      ctx.stroke();
    }

    // 内皮细胞：圆滚滚的小砖
    const cellL = Math.max(22, W / 30);
    for (const side of [-1, 1]) {
      const edge = side < 0 ? topE : botE;
      for (let i = 0, x = cellL / 2; x < W + cellL; i++, x += cellL) {
        const r = rnd(i + (side < 0 ? 100 : 1000));
        if (r < S.damage * 0.28 * (1 - 0.5 * S.heal)) continue;
        const y = edge(g, x) - side * 4;
        const ang = Math.atan2(edge(g, x + 1) - edge(g, x - 1), 2);
        const len = cellL * (0.46 - 0.1 * S.damage);
        ctx.save(); ctx.translate(x, y); ctx.rotate(ang + (r - 0.5) * 0.45 * S.damage);
        rrect(-len, -4.5, len * 2, 9, 4.5);
        ctx.fillStyle = mix("#ffe0e6", "#d9c8cf", S.damage * (0.5 + r)); ctx.fill();
        outline(1.6); ctx.stroke();
        ctx.fillStyle = "#f59fb3";
        ctx.beginPath(); ctx.arc(0, 0, 2.2, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
      }
      // AGEs：皱眉的棕色小团子
      if (S.ages > 0.02) {
        for (let i = 0; i < 12; i++) {
          if (rnd(i + (side < 0 ? 2000 : 2100)) > S.ages) continue;
          const x = (i + 0.2 + rnd(i + 2200) * 0.6) / 12 * W;
          const s = (4 + 4 * S.ages) * Math.max(1, W / 1000);
          const y = edge(g, x) - side * (s + 6);
          ctx.fillStyle = C.age;
          ctx.beginPath();
          ctx.arc(x - s * 0.6, y, s * 0.8, 0, Math.PI * 2);
          ctx.arc(x + s * 0.6, y, s * 0.8, 0, Math.PI * 2);
          ctx.arc(x, y - s * 0.4, s * 0.9, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = C.ink;
          ctx.beginPath(); ctx.arc(x - s * 0.35, y - s * 0.2, s * 0.14, 0, Math.PI * 2); ctx.arc(x + s * 0.35, y - s * 0.2, s * 0.14, 0, Math.PI * 2); ctx.fill();
          outline(1.3);
          ctx.beginPath(); ctx.moveTo(x - s * 0.6, y - s * 0.6); ctx.lineTo(x - s * 0.15, y - s * 0.4);
          ctx.moveTo(x + s * 0.6, y - s * 0.6); ctx.lineTo(x + s * 0.15, y - s * 0.4); ctx.stroke();
        }
      }
    }

    // 活性氧小闪电
    for (const s of sparks) {
      const y = s.top ? topE(g, s.x) + 14 + s.off : botE(g, s.x) - 14 - s.off;
      bolt(s.x, y, Math.max(7, H * 0.022), clamp(s.life / 0.3, 0, 1));
    }

    // 小方糖
    const nG = Math.round(clamp((S.glucose - 3) / 11, 0, 1) * glus.length);
    const cube = Math.max(3.5, H * 0.011);
    for (let i = 0; i < nG; i++) {
      const p = glus[i], x = p.x * W;
      const y = mid(g, x) + p.yn * half(g, x) * 0.88 + Math.sin(time * 2 + p.ph) * 2;
      sugarCube(x, y, cube, p.rot);
    }

    // 红细胞小伙伴
    const rbcR = Math.max(10, H * 0.04);
    const mood = rbcMood();
    for (const p of rbcs) {
      const x = p.x * W;
      const narrow = clamp(g.R / Math.max(half(g, x), 1) - 1, 0, 1);
      const y = mid(g, x) + p.yn * half(g, x) * 0.7 + Math.sin(time * 1.6 + p.ph) * 2;
      ctx.save(); ctx.translate(x, y); ctx.rotate(Math.sin(time * 0.8 + p.ph) * 0.12);
      ctx.scale(1 + 0.15 * narrow, 1 - 0.2 * narrow);
      ctx.beginPath(); ctx.ellipse(0, 0, rbcR, rbcR * 0.82, 0, 0, Math.PI * 2);
      ctx.fillStyle = mix(C.rbc, C.rbcTired, S.ages * 0.6 * (1 - S.heal)); ctx.fill();
      outline(2.2); ctx.stroke();
      ctx.fillStyle = "rgba(255,255,255,0.55)";
      ctx.beginPath(); ctx.ellipse(-rbcR * 0.45, -rbcR * 0.42, rbcR * 0.22, rbcR * 0.13, -0.5, 0, Math.PI * 2); ctx.fill();
      face(0, rbcR * 0.05, rbcR * 0.7, mood - 0.6 * narrow);
      if (mood - narrow < -0.2) { // 汗珠
        ctx.fillStyle = "#9fd8ff";
        ctx.beginPath(); ctx.moveTo(rbcR * 0.75, -rbcR * 0.7); ctx.quadraticCurveTo(rbcR * 1.05, -rbcR * 0.25, rbcR * 0.75, -rbcR * 0.2);
        ctx.quadraticCurveTo(rbcR * 0.5, -rbcR * 0.35, rbcR * 0.75, -rbcR * 0.7); ctx.fill(); outline(1.2); ctx.stroke();
      }
      ctx.restore();
    }

    // 白细胞
    if (S.damage > 0.2) {
      const ms = Math.max(9, H * 0.03);
      for (const m of monos) {
        const x = m.st ? g.px + (m.k - 1.5) * g.sig * 0.3 : m.x * W;
        let y = botE(g, x) - ms - 4;
        if (m.st) y += Math.min(m.d, 1) * (g.R * 0.45 * S.plaque + ms);
        const a = clamp((S.damage - 0.2) * 2, 0, 1) * (m.st && m.d > 1.2 ? 1 - (m.d - 1.2) / 0.4 : 1);
        ctx.save(); ctx.globalAlpha *= a;
        ctx.beginPath(); ctx.arc(x, y, ms, 0, Math.PI * 2);
        ctx.fillStyle = C.mono; ctx.fill(); outline(2); ctx.stroke();
        ctx.fillStyle = "#e7dcff";
        ctx.beginPath(); ctx.arc(x + ms * 0.35, y - ms * 0.35, ms * 0.25, 0, Math.PI * 2); ctx.fill();
        face(x, y + ms * 0.05, ms * 0.7, 0.3);
        ctx.restore();
      }
    }

    // 最后一幕：飘起的小爱心
    if (S.heal > 0.02) {
      for (const h of hearts) {
        const x = h.x * W, y = ((h.y - time * 0.04) % 1 + 1) % 1 * H;
        ctx.save(); ctx.globalAlpha *= S.heal * 0.9;
        heart(x, y, Math.max(7, H * 0.02) * (1 + 0.1 * Math.sin(time * 3 + h.ph)), "#ff9fb0");
        ctx.restore();
      }
    }
    return g;
  }

  // ---------- 毛细血管 ----------
  function drawMicro() {
    const cy = H * 0.52, h = H * 0.085;
    const bm = 4 + S.ages * H * 0.04;
    ctx.fillStyle = C.tissue; ctx.fillRect(0, 0, W, H);
    for (let i = 0; i < 26; i++) {
      const x = rnd(i + 7000) * W, y = rnd(i + 7100) * H;
      if (Math.abs(y - cy) < h + bm + 30) continue;
      ctx.beginPath(); ctx.ellipse(x, y, 26, 17, rnd(i + 7200) * 3, 0, Math.PI * 2);
      ctx.fillStyle = "#ffd6cf"; ctx.fill(); outline(1.5); ctx.stroke();
      ctx.fillStyle = "#f5b3c0"; ctx.beginPath(); ctx.arc(x, y, 5, 0, Math.PI * 2); ctx.fill();
    }
    // 基底膜
    ctx.fillStyle = C.bm;
    ctx.fillRect(0, cy - h - bm, W, bm); ctx.fillRect(0, cy + h, W, bm);
    outline(2.5);
    ctx.beginPath(); ctx.moveTo(0, cy - h - bm); ctx.lineTo(W, cy - h - bm); ctx.moveTo(0, cy + h + bm); ctx.lineTo(W, cy + h + bm); ctx.stroke();
    // 内皮 + 管腔
    ctx.fillStyle = "#ffe0e6"; ctx.fillRect(0, cy - h - 3, W, 6); ctx.fillRect(0, cy + h - 3, W, 6);
    ctx.fillStyle = C.lumenSweet; ctx.fillRect(0, cy - h + 3, W, 2 * h - 6);
    // 渗出的小糖滴
    for (const l of leaks) {
      ctx.save(); ctx.globalAlpha *= clamp(l.life / 2.4, 0, 1);
      sugarCube(l.x, cy + l.dir * (h + bm * 0.5 + l.d), Math.max(3, H * 0.009), l.x);
      ctx.restore();
    }
    // 排队挤过去的红细胞
    const mood = rbcMood();
    for (const c of capR) {
      const x = c.x * W;
      ctx.save(); ctx.translate(x, cy);
      ctx.beginPath(); ctx.ellipse(0, 0, h * 0.62, h * 0.82, 0, 0, Math.PI * 2);
      ctx.fillStyle = C.rbc; ctx.fill(); outline(2.2); ctx.stroke();
      face(0, 0, h * 0.5, mood - 0.3);
      ctx.restore();
    }
    return { cy, h, bm };
  }

  function hud(onMacro) {
    const high = S.glucose > 7;
    pill(14, 12, "血糖", S.glucose.toFixed(1), high ? "#e7a500" : C.mint, false);
    if (onMacro) {
      const nar = Math.round(S.plaque * 39);
      pill(W - 14, 12, "管腔变窄", nar + "%", nar > 20 ? "#f25f6b" : C.mint, true);
    }
  }

  function draw() {
    const L = CH[cur].labels;
    const m = S.micro;
    ctx.globalAlpha = 1;
    if (m < 0.99) {
      const g = drawMacro();
      const on = (k) => L.includes(k) && m < 0.5;
      const ex = W * 0.2;
      callout("endo", on("endo"), ex, topE(g, ex) + 4, ex + W * 0.1, g.cy - g.R - g.wallT * 0.4, "内皮细胞：光滑的内衬");
      const r = rbcs.find(p => p.x > 0.38 && p.x < 0.55) || rbcs[0];
      const rx = r.x * W, ry = mid(g, rx) + r.yn * half(g, rx) * 0.7;
      callout("rbc", on("rbc"), rx, ry, rx + W * 0.1, g.cy + g.R + g.wallT * 0.35, "红细胞小伙伴");
      const nG = Math.max(1, Math.round(clamp((S.glucose - 3) / 11, 0, 1) * glus.length));
      const gp = glus.slice(0, nG).find(p => p.x > 0.68 && p.x < 0.85);
      if (gp) { const gx = gp.x * W; callout("glu", on("glu"), gx, mid(g, gx) + gp.yn * half(g, gx) * 0.88, gx - W * 0.05, g.cy - g.R - g.wallT * 0.4, "葡萄糖（小方糖）"); }
      else callout("glu", false, 0, 0, 0, 0, "");
      const ax = W * 0.35;
      callout("age", on("age"), ax, botE(g, ax) - 12, ax - W * 0.06, g.cy + g.R + g.wallT * 0.35, "AGEs 黏在内皮上");
      const wx = W * 0.8;
      callout("wall", on("wall"), wx, g.cy - g.R - g.wallT * 0.42, wx - W * 0.06, g.cy - g.R * 0.45, "纤维被绑住，管壁变硬");
      const sx = W * 0.18;
      callout("ros", on("ros"), sx, topE(g, sx) + 20, sx + W * 0.06, g.cy - g.R - g.wallT * 0.4, "活性氧小闪电");
      const gx2 = W * 0.4;
      callout("gap", on("gap"), gx2, botE(g, gx2) - 4, gx2 - W * 0.08, g.cy + g.R + g.wallT * 0.35, "内皮出现缝隙");
      callout("mono", on("mono"), g.px, botE(g, g.px) - 14, g.px + W * 0.14, g.cy + g.R + g.wallT * 0.35, "白细胞钻进管壁");
      callout("core", on("core"), g.px, g.cy + g.R - S.plaque * g.R * 0.22, g.px + W * 0.18, g.cy + g.R + g.wallT * 0.35, "脂质核心（泡沫细胞）");
      callout("cap", on("cap"), g.px - g.sig * 0.7, botE(g, g.px - g.sig * 0.7), g.px - W * 0.22, g.cy - g.R * 0.35, "纤维帽");
      callout("heal", on("heal"), W * 0.5, g.cy, W * 0.5, g.cy - g.R - g.wallT * 0.35, "损伤放慢，斑块更稳定");
      hud(true);
    }
    if (m > 0.01) {
      ctx.save(); ctx.globalAlpha = m;
      const c = drawMicro();
      const on = (k) => L.includes(k);
      callout("bm", on("bm"), W * 0.3, c.cy - c.h - c.bm / 2, W * 0.34, H * 0.2, "基底膜变厚");
      const lk = leaks.find(l => l.dir > 0 && l.life > 1.2);
      callout("leak", on("leak") && !!lk, lk ? lk.x : 0, lk ? c.cy + c.h + c.bm * 0.5 + lk.d : 0, W * 0.6, H * 0.84, "管壁渗漏");
      callout("single", on("single"), W * 0.78, c.cy - c.h * 0.8, W * 0.74, H * 0.25, "排好队，一个一个挤过去");
      hud(false);
      ctx.restore();
    }
  }

  Anima.start({
    chapters: CH, state: S, dur: DUR, accent: C.rbc,
    titleCard: { lines: ["多余的糖，", "如何一步步伤害血管"], sub: "血管小剧场 · 7 幕" },
    sync(e) { W = e.W; H = e.H; time = e.time; cur = e.cur; },
    update, draw,
  });
})();
</script>
</body>
</html>
