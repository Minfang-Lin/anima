<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <pattern id="dots" width="56" height="56" patternUnits="userSpaceOnUse"><circle cx="28" cy="28" r="5" fill="#ffd27a"/></pattern>
    <clipPath id="lens"><circle cx="450" cy="450" r="290"/></clipPath>
  </defs>
  <rect width="1024" height="1024" fill="#ffe29a"/>
  <rect width="1024" height="1024" fill="url(#dots)"/>
  <!-- 把手 -->
  <g transform="rotate(-45 450 450)" stroke="#5b3a4a" stroke-width="18" stroke-linejoin="round">
    <rect x="410" y="760" width="80" height="80" fill="#6cc9ae"/>
    <rect x="392" y="830" width="116" height="330" rx="58" fill="#5b3a4a"/>
  </g>
  <!-- 镜片里：粉色组织 + 一段血管 + 红细胞 -->
  <g clip-path="url(#lens)">
    <rect x="100" y="100" width="700" height="700" fill="#ffe7e3"/>
    <g fill="#ffd0c8"><circle cx="230" cy="250" r="26"/><circle cx="640" cy="640" r="30"/><circle cx="660" cy="260" r="20"/><circle cx="250" cy="650" r="22"/></g>
    <g transform="rotate(-20 450 450)" stroke="#5b3a4a" stroke-width="14">
      <rect x="40" y="330" width="820" height="240" fill="#ffb3b3"/>
      <rect x="40" y="366" width="820" height="168" fill="#fff4ec" stroke="none"/>
    </g>
    <g stroke="#5b3a4a" stroke-width="10" stroke-linejoin="round">
      <rect x="236" y="470" width="34" height="34" rx="9" fill="#ffc94d" transform="rotate(15 253 487)"/>
      <rect x="628" y="360" width="30" height="30" rx="8" fill="#ffc94d" transform="rotate(-20 643 375)"/>
    </g>
    <ellipse cx="450" cy="450" rx="140" ry="112" fill="#ff7b7b" stroke="#5b3a4a" stroke-width="14"/>
    <ellipse cx="386" cy="396" rx="34" ry="18" fill="#fff" opacity=".6" transform="rotate(-24 386 396)"/>
    <ellipse cx="412" cy="448" rx="12" ry="16" fill="#5b3a4a"/>
    <ellipse cx="488" cy="448" rx="12" ry="16" fill="#5b3a4a"/>
    <ellipse cx="384" cy="484" rx="20" ry="11" fill="#ffb3c1"/>
    <ellipse cx="516" cy="484" rx="20" ry="11" fill="#ffb3c1"/>
    <path d="M430 482 Q450 504 470 482" fill="none" stroke="#5b3a4a" stroke-width="10" stroke-linecap="round"/>
  </g>
  <!-- 镜框和高光 -->
  <circle cx="450" cy="450" r="290" fill="none" stroke="#5b3a4a" stroke-width="84"/>
  <circle cx="450" cy="450" r="290" fill="none" stroke="#6cc9ae" stroke-width="52"/>
  <path d="M270 330 A 210 210 0 0 1 380 232" fill="none" stroke="#ffffff" stroke-width="22" stroke-linecap="round" opacity=".85"/>
</svg>
